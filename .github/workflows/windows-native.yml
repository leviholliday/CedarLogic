name: Windows native build

# The native Windows app (windows/): plain Win32 and Direct2D on the shared
# engine, no wxWidgets and no Skia. Builds it for Intel/AMD and ARM PCs, runs
# the engine's headless checks, starts the app and takes a picture of its
# window, makes an installer beside each zip (and installs and uninstalls
# it), and publishes them as a rolling test build on pushes to
# windows/native.

on:
  workflow_dispatch:
  push:
    branches:
      - 'windows/native'
      - 'windows/native-**'

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      # One CPU failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          # PCs and laptops (Intel/AMD): built, checked and started here.
          - { arch: x64, run: true }
          # ARM laptops (Snapdragon): cross-built; this runner can't start it.
          - { arch: ARM64, run: false }
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          cmake -S windows -B windows/build -A ${{ matrix.arch }} -DCL_BUILD_TOOLS=${{ matrix.run && 'ON' || 'OFF' }}
          cmake --build windows/build --config Release --parallel

      # The engine through the C interface the app uses: editing, wires,
      # simulation, truth tables, and saving without changing a circuit --
      # drawn with Direct2D, as the app draws. (jmSGTZM is left out of
      # save_check, as on Linux: two overlapping dots on one wire draw in the
      # standard library's hash order.)
      - name: Engine checks
        if: matrix.run
        shell: bash
        run: |
          L=res/cl_gatedefs.xml
          B=windows/build/Release
          $B/cl_check.exe $L
          $B/edit_check.exe $L res/samples/practice.cdl 0
          $B/tt_check.exe $L res/samples/practice.cdl 0
          $B/sim_check.exe $L format/tests/fixtures/lab6.cdl 0 before.png after.png
          $B/save_check.exe $L format/tests/fixtures/Broadcast.cdl format/tests/fixtures/Lab5.cdl \
            "format/tests/fixtures/Routing Backwards.cdl" format/tests/fixtures/lab6.cdl res/samples/practice.cdl

      # A folder that runs as it is: the exe, and res beside it with the gate
      # library, the help and the samples.
      - name: Package
        shell: bash
        run: |
          D=package/CedarLogic
          mkdir -p "$D/res"
          cp windows/build/Release/CedarLogic.exe "$D/"
          cp res/cl_gatedefs.xml "$D/res/"
          cp -r res/help res/samples "$D/res/"
          cp LICENSE "$D/LICENSE.txt"
          cat > "$D/README.txt" <<'EOT'
          CedarLogic for Windows (native test build)

          Double-click CedarLogic.exe to start it. Keep the res folder next to
          it: that's where the gates, the help and the practice circuit are.

          The first time, CedarLogic asks whether to add itself to the Start
          menu and open .cdl files. Say yes and keep this folder where it is;
          the ••• menu's Help > Remove from Start Menu undoes it. Otherwise
          nothing is installed: delete the folder to remove it.

          For a normal install instead, use CedarLogic-Windows-Setup from the
          same download page.

          Windows 10 or 11.
          EOT
          (cd package && 7z a -tzip "../CedarLogic-Windows-native-${{ matrix.arch }}.zip" CedarLogic > /dev/null)
          ls -la CedarLogic-Windows-native-*.zip

      # The installer, from the same folder (windows/installer/CedarLogic.iss):
      # for this user, no administrator; CedarLogic in Start, .cdl files
      # opening in it, an uninstaller in Settings > Apps. Inno Setup 6, from
      # Chocolatey when the runner hasn't got it; the version is CMake's.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $m = Select-String -Path windows/build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$' | Select-Object -First 1
          if (-not $m) { $m = Select-String -Path windows/CMakeLists.txt -Pattern 'project\(\S+ VERSION ([0-9.]+)' | Select-Object -First 1 }
          $version = $m.Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" windows\installer\CedarLogic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item CedarLogic-Windows-Setup-${{ matrix.arch }}.exe

      # Start the packaged app, open a circuit and take a picture of the whole
      # window: catches anything the zip forgot, and shows what it looks like.
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          mkdir -p renders
          A=package/CedarLogic/CedarLogic.exe
          timeout 60 "$A" --version
          timeout 90 "$A" --screenshot "$PWD/renders/window-Lab5.png" format/tests/fixtures/Lab5.cdl
          test -s renders/window-Lab5.png
          timeout 90 "$A" --screenshot "$PWD/renders/window-new.png"
          test -s renders/window-new.png
          timeout 90 "$A" --dark --screenshot "$PWD/renders/window-Lab5-dark.png" format/tests/fixtures/Lab5.cdl
          timeout 90 "$A" --dark --sim-view --screenshot "$PWD/renders/window-sim.png" res/samples/practice.cdl
          timeout 90 "$A" --light --screenshot "$PWD/renders/window-practice.png" res/samples/practice.cdl
          # The dialogs, in each theme (the screenshot is of the dialog).
          timeout 90 "$A" --dark --dialog preferences --screenshot "$PWD/renders/dialog-preferences-dark.png" || true
          timeout 90 "$A" --light --dialog preferences --screenshot "$PWD/renders/dialog-preferences.png" || true
          timeout 90 "$A" --light --dialog preferences --page 1 --screenshot "$PWD/renders/dialog-preferences-1.png" || true
          timeout 90 "$A" --dark --dialog preferences --page 2 --screenshot "$PWD/renders/dialog-preferences-2-dark.png" || true
          timeout 90 "$A" --truth-tab 0 --dark --dialog truth-table --screenshot "$PWD/renders/dialog-truth-table-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --truth-tab 1 --dialog truth-table --screenshot "$PWD/renders/truth-table-kmap.png" res/samples/practice.cdl || true
          timeout 90 "$A" --truth-tab 2 --dialog truth-table --screenshot "$PWD/renders/truth-table-formulas.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog add-gate --screenshot "$PWD/renders/dialog-add-gate-dark.png" || true
          for p in 0 1 2 3 4; do timeout 90 "$A" --dialog welcome --page $p --screenshot "$PWD/renders/welcome-$p.png" || true; done
          timeout 90 "$A" --dialog tour --screenshot "$PWD/renders/tour.png" || true
          # Your Circuits (by now holding the circuits opened above) and a
          # circuit's versions.
          timeout 90 "$A" --dialog library --screenshot "$PWD/renders/your-circuits.png" || true
          timeout 90 "$A" --dark --dialog library --screenshot "$PWD/renders/your-circuits-dark.png" || true
          timeout 90 "$A" --dialog versions --screenshot "$PWD/renders/version-history.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dialog templates --screenshot "$PWD/renders/templates.png" || true
          timeout 90 "$A" --dark --dialog templates --screenshot "$PWD/renders/templates-dark.png" || true
          timeout 90 "$A" --formula "S = A xor B xor Cin; Cout = AB + Cin(A ^ B)" --dialog formula --screenshot "$PWD/renders/build-formula.png" || true
          timeout 90 "$A" --dialog scope --timing "$PWD/renders/timing.png" --screenshot "$PWD/renders/scope.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --dark --dialog scope --timing "$PWD/renders/timing-color.png" --timing-color --screenshot "$PWD/renders/scope-dark.png" res/samples/practice.cdl || true
          # The launch screen, moment by moment (as the Mac's timeline).
          for t in 0.25 0.6 0.9 1.2 1.6 2.2 2.7; do timeout 60 "$A" --splash-frame $t "$PWD/renders/splash-$t.png" || true; done
          timeout 60 "$A" --splash-frame 4.0 "$PWD/renders/splash-first-4.0.png" --first-launch || true
          timeout 90 "$A" --card-frame 0.35 --screenshot "$PWD/renders/opening-card.png" format/tests/fixtures/Lab5.cdl || true
          timeout 90 "$A" --dark --card-frame 0.35 --screenshot "$PWD/renders/opening-card-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dialog quit --screenshot "$PWD/renders/quit.png" || true
          timeout 90 "$A" --dark --dialog quit --screenshot "$PWD/renders/quit-dark.png" || true
          # The zip's first-run question: add CedarLogic to Start?
          timeout 90 "$A" --dialog start-menu --screenshot "$PWD/renders/start-menu.png" || true
          timeout 90 "$A" --dark --dialog start-menu --screenshot "$PWD/renders/start-menu-dark.png" || true
          timeout 60 "$A" --feedback-probe || echo "::warning::the feedback probe failed"
          timeout 90 "$A" --dialog feedback --screenshot "$PWD/renders/feedback.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog feedback --screenshot "$PWD/renders/feedback-dark.png" res/samples/practice.cdl || true
          for p in 0 1 2 3 4 5 6; do timeout 90 "$A" --dialog whatsnew --page $p --screenshot "$PWD/renders/whatsnew-$p.png" || true; done
          timeout 90 "$A" --dialog help --screenshot "$PWD/renders/help.png" || true
          timeout 90 "$A" --dark --dialog help --help-page editing --screenshot "$PWD/renders/help-editing-dark.png" || true
          timeout 90 "$A" --dialog help --help-page first --screenshot "$PWD/renders/help-first.png" || true
          timeout 90 "$A" --select "Clock" --dialog gate-settings --screenshot "$PWD/renders/gate-settings.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --dark --select "AND" --dialog gate-settings --screenshot "$PWD/renders/gate-settings-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --place AE_RAM_8x8 --dialog gate-settings --screenshot "$PWD/renders/ram-editor.png" || true
          timeout 90 "$A" --dark --place AA_RAM_4x4 --dialog gate-settings --screenshot "$PWD/renders/ram-editor-dark.png" || true
          timeout 90 "$A" --dialog export --screenshot "$PWD/renders/export-image.png" format/tests/fixtures/Lab5.cdl || true
          timeout 90 "$A" --dark --dialog export --screenshot "$PWD/renders/export-image-dark.png" res/samples/practice.cdl || true
          windows/build/Release/render_png.exe res/cl_gatedefs.xml format/tests/fixtures/Lab5.cdl 0 renders/Lab5-page1.png
          cp before.png after.png renders/

      # Clicks on the toolbar's buttons and the window's drawn Minimize and
      # Close, as Windows sends them (press, then release), each checked for
      # its effect: a picture can't show that a button does nothing.
      - name: Click test
        if: matrix.run
        shell: bash
        run: timeout 120 package/CedarLogic/CedarLogic.exe --click-test

      # The zip's copy adding itself to Start and to .cdl files (as its
      # first-run question's yes does), checked the way Windows looks them
      # up, then taking itself away again.
      - name: Start menu test
        if: matrix.run
        shell: bash
        run: timeout 60 package/CedarLogic/CedarLogic.exe --start-menu-test

      # Install as someone would (quietly here), check CedarLogic starts from
      # there, is in Start and owns .cdl files; then uninstall and check it's
      # all gone.
      - name: Installer test
        if: matrix.run
        shell: pwsh
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'CedarLogic.lnk'
          $prog = 'HKCU:\Software\Classes\CedarLogic.Circuit'
          $p = Start-Process -FilePath ".\CedarLogic-Windows-Setup-${{ matrix.arch }}.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$PWD\setup.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup ended with $($p.ExitCode)" }
          # Where it went, as setup noted it for the app.
          $dir = (Get-ItemProperty 'HKCU:\Software\CedarLogic\Native' -ErrorAction SilentlyContinue).InstallDir
          if (-not $dir -or $dir -notlike '*\AppData\Local\Programs\CedarLogic') { Get-Content setup.log; throw "InstallDir is '$dir'" }
          $exe = Join-Path $dir 'CedarLogic.exe'
          foreach ($f in @($exe, "$dir\res\cl_gatedefs.xml", "$dir\unins000.exe", $lnk)) {
            if (-not (Test-Path $f)) { Get-Content setup.log; throw "not installed: $f" }
          }
          $open = (Get-Item "$prog\shell\open\command").GetValue('')
          if ($open -ne "`"$exe`" `"%1`"") { throw ".cdl files open with: $open" }
          if ((Get-Item 'HKCU:\Software\Classes\.cdl').GetValue('') -ne 'CedarLogic.Circuit') { throw '.cdl isn''t CedarLogic''s' }
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshot', "`"$PWD\renders\installed.png`"", "`"$PWD\res\samples\practice.cdl`"" -PassThru
          $null = $p.Handle   # so ExitCode is there once it's gone
          $p | Wait-Process -Timeout 90
          if ($p.ExitCode -ne 0 -or -not (Test-Path renders\installed.png)) { throw "the installed CedarLogic didn't start ($($p.ExitCode))" }
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          # The uninstaller carries on from a copy of itself, and takes the
          # folder away last: wait for that.
          for ($i = 0; $i -lt 90 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { Write-Output "::warning::left in $dir after uninstalling: $((Get-ChildItem -Recurse -Name $dir) -join ', ')" }
          foreach ($f in @($exe, "$dir\res", $lnk, $prog, 'HKCU:\Software\CedarLogic\Native')) {
            if (Test-Path $f) { throw "still there after uninstalling: $f" }
          }
          if ((Test-Path 'HKCU:\Software\Classes\.cdl') -and (Get-Item 'HKCU:\Software\Classes\.cdl').GetValue('') -eq 'CedarLogic.Circuit') {
            throw '.cdl is still CedarLogic''s'
          }
          Write-Output 'installed, started, uninstalled: all as expected'

      - name: Upload zip and installer
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Windows-native-${{ matrix.arch }}
          path: |
            CedarLogic-Windows-native-${{ matrix.arch }}.zip
            CedarLogic-Windows-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload renders
        if: always() && matrix.run
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Windows-native-renders
          path: renders
          if-no-files-found: warn

  # A public download for testers without a GitHub account: one rolling
  # pre-release, replaced on every push to windows/native. Its own job, after
  # both builds, so the release only ever holds a matching set (the two
  # installers and the two zips).
  publish:
    needs: build
    if: github.ref == 'refs/heads/windows/native'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the zips and installers
        uses: actions/download-artifact@v8
        with:
          pattern: CedarLogic-Windows-native-*
          path: zips
          merge-multiple: true

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f zips/*.png
          ls -la zips
          TAG=windows-native-testing
          NOTES=$(cat <<EOT
          Native Windows test build from windows/native (${GITHUB_SHA::7}). Not a release: expect missing pieces.

          To install: download CedarLogic-Windows-Setup-x64.exe and run it (on a Windows on ARM laptop, such as a Snapdragon one: CedarLogic-Windows-Setup-ARM64.exe). Windows SmartScreen may say it doesn't recognise the app (it isn't signed yet): choose More info, then Run anyway. It installs for you only, with no administrator needed: CedarLogic goes in the Start menu, .cdl files open in it, and Settings > Apps removes it. It updates itself from inside the app.

          This is CedarLogic rebuilt natively for Windows, the way the Mac app was: plain Windows controls and Direct2D on the same engine as every other CedarLogic, with nothing else to install.

          Rather not install? The zips run as they are:
          - x64: ordinary PCs and laptops (Intel/AMD)
          - ARM64: Windows on ARM laptops (Snapdragon)

          Unzip one anywhere and double-click CedarLogic.exe inside (the same More info, then Run anyway). The first time, it offers to add itself to the Start menu and open .cdl files.
          EOT
          )
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Native Windows test build" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --title "Native Windows test build" --notes "$NOTES"
          fi
          gh release upload "$TAG" zips/*.exe zips/*.zip --clobber
          # Drop anything this run didn't make, so only the current set is offered.
          keep=$(cd zips && ls *.exe *.zip)
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            echo "$keep" | grep -qxF "$a" || gh release delete-asset "$TAG" "$a" -y
          done
