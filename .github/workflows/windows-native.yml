name: Windows native build

# The native Windows app (windows/): plain Win32 and Direct2D on the shared
# engine, no wxWidgets and no Skia. Builds it for Intel/AMD and ARM PCs, runs
# the engine's headless checks, starts the app and takes a picture of its
# window, makes an installer beside each zip (and installs and uninstalls
# it), and publishes them as a rolling test build on pushes to
# windows/native.

on:
  workflow_dispatch:
  push:
    branches:
      - 'windows/native'
      - 'windows/native-**'

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      # One CPU failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          # PCs and laptops (Intel/AMD): built, checked and started here.
          - { arch: x64, run: true }
          # ARM laptops (Snapdragon): cross-built; this runner can't start it.
          - { arch: ARM64, run: false }
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          cmake -S windows -B windows/build -A ${{ matrix.arch }} -DCL_BUILD_TOOLS=${{ matrix.run && 'ON' || 'OFF' }}
          cmake --build windows/build --config Release --parallel

      # The engine through the C interface the app uses: editing, wires,
      # simulation, truth tables, and saving without changing a circuit --
      # drawn with Direct2D, as the app draws. (jmSGTZM is left out of
      # save_check, as on Linux: two overlapping dots on one wire draw in the
      # standard library's hash order.)
      - name: Engine checks
        if: matrix.run
        shell: bash
        run: |
          L=res/cl_gatedefs.xml
          B=windows/build/Release
          $B/cl_check.exe $L
          $B/edit_check.exe $L res/samples/practice.cdl 0
          $B/tt_check.exe $L res/samples/practice.cdl 0
          $B/sim_check.exe $L format/tests/fixtures/lab6.cdl 0 before.png after.png
          $B/save_check.exe $L format/tests/fixtures/Broadcast.cdl format/tests/fixtures/Lab5.cdl \
            "format/tests/fixtures/Routing Backwards.cdl" format/tests/fixtures/lab6.cdl res/samples/practice.cdl

      # A folder that runs as it is: the exe, and res beside it with the gate
      # library, the help and the samples.
      - name: Package
        shell: bash
        run: |
          D=package/CedarLogic
          mkdir -p "$D/res"
          cp windows/build/Release/CedarLogic.exe "$D/"
          cp res/cl_gatedefs.xml "$D/res/"
          cp -r res/help res/samples "$D/res/"
          cp LICENSE "$D/LICENSE.txt"
          cat > "$D/README.txt" <<'EOT'
          CedarLogic for Windows (native test build)

          Double-click CedarLogic.exe to start it. Keep the res folder next to
          it: that's where the gates, the help and the practice circuit are.

          The first time, CedarLogic asks whether to add itself to the Start
          menu and open .cdl files. Say yes and keep this folder where it is;
          the ••• menu's Help > Remove from Start Menu undoes it. Otherwise
          nothing is installed: delete the folder to remove it.

          For a normal install instead, use CedarLogic-Windows-Setup from the
          same download page.

          Windows 10 or 11.
          EOT
          (cd package && 7z a -tzip "../CedarLogic-Windows-native-${{ matrix.arch }}.zip" CedarLogic > /dev/null)
          ls -la CedarLogic-Windows-native-*.zip

      # The installer, from the same folder (windows/installer/CedarLogic.iss):
      # for this user, no administrator; CedarLogic in Start, .cdl files
      # opening in it, an uninstaller in Settings > Apps. Inno Setup 6, from
      # Chocolatey when the runner hasn't got it; the version is CMake's.
      # New and not yet seen on a real Windows, so for now this and its two
      # tests below don't hold the zips back: a failure shows on the run, and
      # the release goes out without installers (the Installer test takes a
      # setup that fails it away before it's uploaded). (Take continue-on-error
      # off these three once they've passed.)
      - name: Installer
        shell: pwsh
        continue-on-error: true
        run: |
          # Wherever this Inno Setup put itself (Program Files or its x86 one).
          function Find-Iscc {
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "${env:ProgramFiles}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
            if (-not $iscc) { throw "Inno Setup couldn't be installed (choco ended with $LASTEXITCODE)" }
          }
          Write-Output "Inno Setup: $iscc"
          $m = Select-String -Path windows/build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$' | Select-Object -First 1
          if (-not $m) { $m = Select-String -Path windows/CMakeLists.txt -Pattern 'project\(\S+ VERSION ([0-9.]+)' | Select-Object -First 1 }
          $version = $m.Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" windows\installer\CedarLogic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item CedarLogic-Windows-Setup-${{ matrix.arch }}.exe

      # Start the packaged app, open a circuit and take a picture of the whole
      # window: catches anything the zip forgot, and shows what it looks like.
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          mkdir -p renders
          A=package/CedarLogic/CedarLogic.exe
          timeout 60 "$A" --version
          timeout 90 "$A" --screenshot "$PWD/renders/window-Lab5.png" format/tests/fixtures/Lab5.cdl
          test -s renders/window-Lab5.png
          timeout 90 "$A" --screenshot "$PWD/renders/window-new.png"
          test -s renders/window-new.png
          timeout 90 "$A" --dark --screenshot "$PWD/renders/window-Lab5-dark.png" format/tests/fixtures/Lab5.cdl
          timeout 90 "$A" --dark --sim-view --screenshot "$PWD/renders/window-sim.png" res/samples/practice.cdl
          timeout 90 "$A" --light --screenshot "$PWD/renders/window-practice.png" res/samples/practice.cdl
          # Split view (lab6: a circuit on each of its first tabs), focus mode
          # (the tabs as the title row), both, and a tab being renamed in place.
          timeout 90 "$A" --split --screenshot "$PWD/renders/window-split.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --dark --split --screenshot "$PWD/renders/window-split-dark.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --focus --screenshot "$PWD/renders/window-focus.png" format/tests/fixtures/Lab5.cdl || true
          timeout 90 "$A" --dark --focus --split --screenshot "$PWD/renders/window-focus-split-dark.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --rename-tab --screenshot "$PWD/renders/window-rename-tab.png" format/tests/fixtures/Lab5.cdl || true
          # The dialogs, in each theme (the screenshot is of the dialog).
          timeout 90 "$A" --dark --dialog preferences --screenshot "$PWD/renders/dialog-preferences-dark.png" || true
          timeout 90 "$A" --light --dialog preferences --screenshot "$PWD/renders/dialog-preferences.png" || true
          timeout 90 "$A" --light --dialog preferences --page 1 --screenshot "$PWD/renders/dialog-preferences-1.png" || true
          timeout 90 "$A" --dark --dialog preferences --page 2 --screenshot "$PWD/renders/dialog-preferences-2-dark.png" || true
          timeout 90 "$A" --truth-tab 0 --dark --dialog truth-table --screenshot "$PWD/renders/dialog-truth-table-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --truth-tab 1 --dialog truth-table --screenshot "$PWD/renders/truth-table-kmap.png" res/samples/practice.cdl || true
          timeout 90 "$A" --truth-tab 2 --dialog truth-table --screenshot "$PWD/renders/truth-table-formulas.png" res/samples/practice.cdl || true
          # Check My Circuit: a half adder's lights against its formula (a match), then
          # against a wrong one in other names (picked by position, a wrong row in red);
          # and the practice circuit's (its unknown lights noted).
          mkdir -p check
          cat > check/half-adder.cdl <<'EOF'
          (cedarlogic
            (version 3)
            (generator "CedarLogic 4.0.0")
            (page 0
              (name "Half Adder")
              (gate "AA_TOGGLE" (uuid "1") (at -12 4) (angle 0) (lparam "OUTPUT_NUM" "0"))
              (gate "AA_LABEL" (uuid "2") (at -15 4) (angle 0) (gparam "LABEL_TEXT" "A") (gparam "TEXT_HEIGHT" "2"))
              (gate "AA_TOGGLE" (uuid "3") (at -12 -2) (angle 0) (lparam "OUTPUT_NUM" "0"))
              (gate "AA_LABEL" (uuid "4") (at -15 -2) (angle 0) (gparam "LABEL_TEXT" "B") (gparam "TEXT_HEIGHT" "2"))
              (gate "AI_XOR2" (uuid "5") (at 4 3) (angle 0))
              (gate "AA_AND2" (uuid "6") (at 4 -3) (angle 0))
              (gate "GA_LED" (uuid "7") (at 12 3) (angle 0))
              (gate "AA_LABEL" (uuid "8") (at 15 3) (angle 0) (gparam "LABEL_TEXT" "S") (gparam "TEXT_HEIGHT" "2"))
              (gate "GA_LED" (uuid "9") (at 12 -3) (angle 0))
              (gate "AA_LABEL" (uuid "10") (at 16 -3) (angle 0) (gparam "LABEL_TEXT" "Cout") (gparam "TEXT_HEIGHT" "2"))
              (wire (ids "1001")
                (seg "0" h (pts -10 4 1 4) (connect "1" "OUT_0") (connect "5" "IN_0") (cross -4 "1"))
                (seg "1" v (pts -4 -2 -4 4) (connect "6" "IN_0") (cross 4 "0")))
              (wire (ids "1002")
                (seg "0" h (pts -10 -2 1 -2) (connect "3" "OUT_0") (connect "6" "IN_1") (cross -6 "1"))
                (seg "1" v (pts -6 -2 -6 2) (connect "5" "IN_1") (cross -2 "0")))
              (wire (ids "1003") (seg "0" h (pts 7 3 11 3) (connect "5" "OUT") (connect "7" "N_in0")))
              (wire (ids "1004") (seg "0" h (pts 7 -3 11 -3) (connect "6" "OUT") (connect "9" "N_in0")))))
          EOF
          timeout 90 "$A" --dialog check --check "S = A ^ B; Cout = AB" --screenshot "$PWD/renders/check.png" check/half-adder.cdl || true
          timeout 90 "$A" --dark --dialog check --check "Sum = A + B; Carry = AB" --screenshot "$PWD/renders/check-wrong-dark.png" check/half-adder.cdl || true
          timeout 90 "$A" --dialog check --check "Y1 = A ^ B ^ C; Y2 = AB; Y3 = AC; Y4 = BC" --screenshot "$PWD/renders/check-practice.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog add-gate --screenshot "$PWD/renders/dialog-add-gate-dark.png" || true
          for p in 0 1 2 3 4; do timeout 90 "$A" --dialog welcome --page $p --screenshot "$PWD/renders/welcome-$p.png" || true; done
          timeout 90 "$A" --dialog tour --screenshot "$PWD/renders/tour.png" || true
          # Your Circuits (by now holding the circuits opened above) and a
          # circuit's versions.
          timeout 90 "$A" --dialog library --screenshot "$PWD/renders/your-circuits.png" || true
          timeout 90 "$A" --dark --dialog library --screenshot "$PWD/renders/your-circuits-dark.png" || true
          timeout 90 "$A" --dialog versions --screenshot "$PWD/renders/version-history.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dialog templates --screenshot "$PWD/renders/templates.png" || true
          timeout 90 "$A" --dark --dialog templates --screenshot "$PWD/renders/templates-dark.png" || true
          timeout 90 "$A" --formula "S = A xor B xor Cin; Cout = AB + Cin(A ^ B)" --dialog formula --screenshot "$PWD/renders/build-formula.png" || true
          timeout 90 "$A" --dialog scope --timing "$PWD/renders/timing.png" --screenshot "$PWD/renders/scope.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --dark --dialog scope --timing "$PWD/renders/timing-color.png" --timing-color --screenshot "$PWD/renders/scope-dark.png" res/samples/practice.cdl || true
          # The oscilloscope docks under the canvas: here under a split.
          timeout 90 "$A" --split --dialog scope --screenshot "$PWD/renders/scope-split.png" format/tests/fixtures/lab6.cdl || true
          # The launch screen, moment by moment (as the Mac's timeline).
          for t in 0.25 0.6 0.9 1.2 1.6 2.2 2.7; do timeout 60 "$A" --splash-frame $t "$PWD/renders/splash-$t.png" || true; done
          timeout 60 "$A" --splash-frame 4.0 "$PWD/renders/splash-first-4.0.png" --first-launch || true
          timeout 90 "$A" --card-frame 0.35 --screenshot "$PWD/renders/opening-card.png" format/tests/fixtures/Lab5.cdl || true
          timeout 90 "$A" --dark --card-frame 0.35 --screenshot "$PWD/renders/opening-card-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dialog quit --screenshot "$PWD/renders/quit.png" || true
          timeout 90 "$A" --dark --dialog quit --screenshot "$PWD/renders/quit-dark.png" || true
          # The app's alert card: a delete's question, and a name to type.
          timeout 90 "$A" --dialog alert --screenshot "$PWD/renders/alert.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog alert --screenshot "$PWD/renders/alert-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dialog rename --screenshot "$PWD/renders/alert-rename.png" res/samples/practice.cdl || true
          # A cedarlogic:// link that can't be opened.
          timeout 90 "$A" --dialog bad-link --screenshot "$PWD/renders/link-bad.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog bad-link --screenshot "$PWD/renders/link-bad-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dialog about --screenshot "$PWD/renders/about.png" || true
          # A wire's value, shown where the pointer rests on it (and the whole
          # wire lit, in Simulation View).
          timeout 90 "$A" --wire-tag --screenshot "$PWD/renders/wire-tag.png" res/samples/practice.cdl || true
          timeout 90 "$A" --sim-view --wire-tag --screenshot "$PWD/renders/wire-tag-sim.png" res/samples/practice.cdl || true
          # The status bar along the bottom, with a note in it.
          timeout 90 "$A" --note "Saved, and a version was kept." --screenshot "$PWD/renders/status-note.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --note "Copied." --screenshot "$PWD/renders/status-note-dark.png" res/samples/practice.cdl || true
          # The zip's first-run question: add CedarLogic to Start?
          timeout 90 "$A" --dialog start-menu --screenshot "$PWD/renders/start-menu.png" || true
          timeout 90 "$A" --dark --dialog start-menu --screenshot "$PWD/renders/start-menu-dark.png" || true
          timeout 60 "$A" --feedback-probe || echo "::warning::the feedback probe failed"
          timeout 90 "$A" --dialog feedback --screenshot "$PWD/renders/feedback.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog feedback --screenshot "$PWD/renders/feedback-dark.png" res/samples/practice.cdl || true
          for p in 0 1 2 3 4 5 6; do timeout 90 "$A" --dialog whatsnew --page $p --screenshot "$PWD/renders/whatsnew-$p.png" || true; done
          timeout 90 "$A" --dialog help --screenshot "$PWD/renders/help.png" || true
          timeout 90 "$A" --dark --dialog help --help-page editing --screenshot "$PWD/renders/help-editing-dark.png" || true
          timeout 90 "$A" --dialog help --help-page first --screenshot "$PWD/renders/help-first.png" || true
          timeout 90 "$A" --select "Clock" --dialog gate-settings --screenshot "$PWD/renders/gate-settings.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --dark --select "AND" --dialog gate-settings --screenshot "$PWD/renders/gate-settings-dark.png" res/samples/practice.cdl || true
          timeout 90 "$A" --place AE_RAM_8x8 --dialog gate-settings --screenshot "$PWD/renders/ram-editor.png" || true
          timeout 90 "$A" --dark --place AA_RAM_4x4 --dialog gate-settings --screenshot "$PWD/renders/ram-editor-dark.png" || true
          timeout 90 "$A" --dialog export --screenshot "$PWD/renders/export-image.png" format/tests/fixtures/Lab5.cdl || true
          timeout 90 "$A" --dark --dialog export --screenshot "$PWD/renders/export-image-dark.png" res/samples/practice.cdl || true
          # Export Lab Report's sheet (practice.cdl has TO labels, so the timing diagram's tick is on).
          timeout 90 "$A" --dialog lab-report --screenshot "$PWD/renders/lab-report-sheet.png" res/samples/practice.cdl || true
          timeout 90 "$A" --dark --dialog lab-report --screenshot "$PWD/renders/lab-report-sheet-dark.png" format/tests/fixtures/Lab5.cdl || true
          windows/build/Release/render_png.exe res/cl_gatedefs.xml format/tests/fixtures/Lab5.cdl 0 renders/Lab5-page1.png
          cp before.png after.png renders/

      # Settings, page by page (General, Appearance, Canvas, Toolbar,
      # Shortcuts), the Keyboard Shortcuts list, and the window in each
      # toolbar style (Seamless is a new install's).
      - name: Settings and toolbar pictures
        if: matrix.run
        shell: bash
        run: |
          mkdir -p renders
          A=package/CedarLogic/CedarLogic.exe
          for p in 0 1 2 3 4; do
            timeout 90 "$A" --light --dialog preferences --page $p --screenshot "$PWD/renders/settings-$p.png" || true
            timeout 90 "$A" --dark --dialog preferences --page $p --screenshot "$PWD/renders/settings-$p-dark.png" || true
          done
          timeout 90 "$A" --light --dialog shortcuts --screenshot "$PWD/renders/shortcuts.png" || true
          timeout 90 "$A" --dark --dialog shortcuts --screenshot "$PWD/renders/shortcuts-dark.png" || true
          for s in seamless classic minimal; do
            timeout 90 "$A" --light --toolbar-style $s --screenshot "$PWD/renders/toolbar-$s.png" res/samples/practice.cdl || true
            timeout 90 "$A" --dark --toolbar-style $s --screenshot "$PWD/renders/toolbar-$s-dark.png" res/samples/practice.cdl || true
          done
          timeout 90 "$A" --dark --sim-view --toolbar-style seamless --screenshot "$PWD/renders/toolbar-seamless-sim.png" res/samples/practice.cdl || true
          # Each style over a split view and its status bar, and Minimal's in
          # focus mode (the bar slid away whatever its style).
          timeout 90 "$A" --light --toolbar-style classic --split --screenshot "$PWD/renders/toolbar-classic-split.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --dark --toolbar-style minimal --split --screenshot "$PWD/renders/toolbar-minimal-split-dark.png" format/tests/fixtures/lab6.cdl || true
          timeout 90 "$A" --light --toolbar-style minimal --focus --screenshot "$PWD/renders/toolbar-minimal-focus.png" format/tests/fixtures/lab6.cdl || true

      # Export Lab Report without a window (--lab-report): a circuit run a
      # while, then its PDF -- in colour and in black and white, and for a
      # circuit of several pages -- each checked to be a whole PDF (its
      # header, its end, at least one page) and kept with the pictures: the
      # pages are pictures drawn here with Direct2D, so open one to see them.
      # (A first run on real Windows: a report that fails shows as a warning
      # and keeps the pictures, but doesn't hold the zips back.)
      - name: Lab report
        if: matrix.run
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p renders
          A=package/CedarLogic/CedarLogic.exe
          timeout 180 "$A" --lab-report res/samples/practice.cdl "$PWD/renders/lab-report-practice.pdf"
          timeout 180 "$A" --lab-report res/samples/practice.cdl "$PWD/renders/lab-report-practice-bw.pdf" bw
          timeout 180 "$A" --lab-report format/tests/fixtures/lab6.cdl "$PWD/renders/lab-report-lab6.pdf"
          for f in renders/lab-report-*.pdf; do
            test -s "$f"
            head -c 5 "$f" | grep -q '^%PDF-'
            tail -c 8 "$f" | grep -aq '%%EOF'
            pages=$(grep -a -o '/Type /Page /Parent' "$f" | wc -l)
            echo "$f: $(wc -c < "$f") bytes, $pages pages"
            test "$pages" -ge 1
          done

      # Clicks on the toolbar's buttons, the tabs' +, and the window's drawn
      # Minimize (on the toolbar, and on the tabs in focus mode) and Close,
      # as Windows sends them (press, then release), and a gate dragged from
      # the side panel onto the canvas, each checked for its effect: a
      # picture can't show that a button does nothing. Once in each toolbar
      # style (Minimal leaves most tools to its ••• menu, so they're skipped).
      - name: Click test
        if: matrix.run
        shell: bash
        run: |
          failed=0
          for s in seamless classic minimal; do
            timeout 120 package/CedarLogic/CedarLogic.exe --click-test --toolbar-style $s || failed=1
          done
          exit $failed

      # The zip's copy adding itself to Start and to .cdl files (as its
      # first-run question's yes does), checked the way Windows looks them
      # up, then taking itself away again.
      - name: Start menu test
        if: matrix.run
        shell: bash
        continue-on-error: true
        run: timeout 60 package/CedarLogic/CedarLogic.exe --start-menu-test

      # Share Link and cedarlogic:// links (windows/App/ShareLink.h). The link
      # format's own checks (round trips, links python's zlib made -- one of each
      # kind of deflate block -- and ones that must be refused, and the cache's
      # files); the link the app makes for a circuit, which python's zlib must
      # inflate to the circuit; a link python's zlib made of it, which the app
      # must decode; and the app opening a cedarlogic:// link (a picture of the
      # window it opens: the circuit, named from the link). New and not yet seen
      # on a real Windows, so for now it doesn't hold the zips back (take
      # continue-on-error off once it has passed).
      - name: Share link test
        if: matrix.run
        shell: bash
        continue-on-error: true
        run: |
          A=package/CedarLogic/CedarLogic.exe
          PY=$(command -v python || command -v python3)
          mkdir -p renders
          "$PY" - <<'PY'
          import base64, zlib
          raw = open("res/samples/practice.cdl", "rb").read()
          c = zlib.compressobj(9, zlib.DEFLATED, -15)
          open("share-python.link", "w").write("c=" + base64.urlsafe_b64encode(c.compress(raw) + c.flush()).decode().rstrip("="))
          PY
          timeout 60 "$A" --share-test res/samples/practice.cdl share-app.link share-python.link
          "$PY" - <<'PY'
          import base64, zlib
          app = open("share-app.link").read().strip()
          made = zlib.decompress(base64.urlsafe_b64decode(app + "=" * (-len(app) % 4)), -15)
          assert made == open("res/samples/practice.cdl", "rb").read(), "python's zlib inflated the app's link to something else"
          print("python's zlib inflates the app's link (%d characters) to the circuit (%d bytes)" % (len(app), len(made)))
          PY
          timeout 90 "$A" --screenshot "$PWD/renders/link-opened.png" "cedarlogic://open#c=$(cat share-app.link)&n=Shared%20practice"
          test -s renders/link-opened.png

      # Install as someone would (quietly here), check CedarLogic starts from
      # there, is in Start and owns .cdl files; then uninstall and check it's
      # all gone.
      - name: Installer test
        if: matrix.run
        shell: pwsh
        continue-on-error: true
        run: |
          $setup = ".\CedarLogic-Windows-Setup-${{ matrix.arch }}.exe"
          try {
            $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'CedarLogic.lnk'
            $prog = 'HKCU:\Software\Classes\CedarLogic.Circuit'
            $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$PWD\setup.log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup ended with $($p.ExitCode)" }
            # Where it went, as setup noted it for the app.
            $dir = (Get-ItemProperty 'HKCU:\Software\CedarLogic\Native' -ErrorAction SilentlyContinue).InstallDir
            if (-not $dir -or $dir -notlike '*\AppData\Local\Programs\CedarLogic') { Get-Content setup.log; throw "InstallDir is '$dir'" }
            $exe = Join-Path $dir 'CedarLogic.exe'
            foreach ($f in @($exe, "$dir\res\cl_gatedefs.xml", "$dir\unins000.exe", $lnk)) {
              if (-not (Test-Path $f)) { Get-Content setup.log; throw "not installed: $f" }
            }
            $open = (Get-Item "$prog\shell\open\command").GetValue('')
            if ($open -ne "`"$exe`" `"%1`"") { throw ".cdl files open with: $open" }
            if ((Get-Item 'HKCU:\Software\Classes\.cdl').GetValue('') -ne 'CedarLogic.Circuit') { throw '.cdl isn''t CedarLogic''s' }
            # cedarlogic:// links: a URL protocol, run with the link as the argument.
            $scheme = 'HKCU:\Software\Classes\cedarlogic'
            if ((Get-Item $scheme).GetValueNames() -notcontains 'URL Protocol') { throw 'cedarlogic isn''t a URL protocol' }
            $link = (Get-Item "$scheme\shell\open\command").GetValue('')
            if ($link -ne "`"$exe`" `"%1`"") { throw "cedarlogic:// links open with: $link" }
            $p = Start-Process -FilePath $exe -ArgumentList '--screenshot', "`"$PWD\renders\installed.png`"", "`"$PWD\res\samples\practice.cdl`"" -PassThru
            $null = $p.Handle   # so ExitCode is there once it's gone
            $p | Wait-Process -Timeout 90
            if ($p.ExitCode -ne 0 -or -not (Test-Path renders\installed.png)) { throw "the installed CedarLogic didn't start ($($p.ExitCode))" }
            $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            # The uninstaller carries on from a copy of itself, and takes the
            # folder away last: wait for that.
            for ($i = 0; $i -lt 90 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path $dir) { Write-Output "::warning::left in $dir after uninstalling: $((Get-ChildItem -Recurse -Name $dir) -join ', ')" }
            foreach ($f in @($exe, "$dir\res", $lnk, $prog, $scheme, 'HKCU:\Software\CedarLogic\Native')) {
              if (Test-Path $f) { throw "still there after uninstalling: $f" }
            }
            if ((Test-Path 'HKCU:\Software\Classes\.cdl') -and (Get-Item 'HKCU:\Software\Classes\.cdl').GetValue('') -eq 'CedarLogic.Circuit') {
              throw '.cdl is still CedarLogic''s'
            }
            Write-Output 'installed, started, uninstalled: all as expected'
          } catch {
            # A setup that failed this isn't published (nor is the ARM64 one, made
            # by the same script and never tried here); the zips still are.
            Remove-Item $setup -ErrorAction SilentlyContinue
            Write-Output "::warning::the installer failed its test, so this build goes out without installers: $_"
            throw
          }

      - name: Upload zip and installer
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Windows-native-${{ matrix.arch }}
          path: |
            CedarLogic-Windows-native-${{ matrix.arch }}.zip
            CedarLogic-Windows-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload renders
        if: always() && matrix.run
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Windows-native-renders
          path: renders
          if-no-files-found: warn

  # A public download for testers without a GitHub account: one rolling
  # pre-release, replaced on every push to windows/native. Its own job, after
  # both builds, so the release only ever holds a matching set (the two
  # installers and the two zips).
  publish:
    needs: build
    if: github.ref == 'refs/heads/windows/native'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the zips and installers
        uses: actions/download-artifact@v8
        with:
          pattern: CedarLogic-Windows-native-*
          path: zips
          merge-multiple: true

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f zips/*.png zips/*.pdf
          shopt -s nullglob
          ls -la zips
          TAG=windows-native-testing
          # The installers first -- the ones this run made and that passed
          # (their steps don't hold the build back yet; a setup that failed
          # its install test wasn't uploaded). The ARM64 one can't be tried on
          # this runner: it goes out only beside an x64 one that passed, made
          # by the same script.
          X64=zips/CedarLogic-Windows-Setup-x64.exe
          ARM=zips/CedarLogic-Windows-Setup-ARM64.exe
          [ -f "$X64" ] || rm -f "$ARM"
          SMARTSCREEN="Windows SmartScreen may say it doesn't recognise the app (it isn't signed yet): choose More info, then Run anyway."
          ON_ARM="on a Windows on ARM laptop, such as a Snapdragon one: CedarLogic-Windows-Setup-ARM64.exe"
          [ -f "$ARM" ] || ON_ARM="on a Windows on ARM laptop, such as a Snapdragon one, use the ARM64 zip below: this build has no installer for it"
          SETUP="To install: download CedarLogic-Windows-Setup-x64.exe and run it ($ON_ARM). $SMARTSCREEN It installs for you only, with no administrator needed: CedarLogic goes in the Start menu, .cdl files open in it, and Settings > Apps removes it. It updates itself from inside the app."
          ZIPS="Rather not install? The zips run as they are:"
          if [ ! -f "$X64" ]; then
            SETUP="This build has no installers; the zips below run as they are. $SMARTSCREEN"
            ZIPS="Pick the file for your computer:"
          fi
          NOTES=$(cat <<EOT
          Native Windows test build from windows/native (${GITHUB_SHA::7}). Not a release: expect missing pieces.

          $SETUP

          This is CedarLogic rebuilt natively for Windows, the way the Mac app was: plain Windows controls and Direct2D on the same engine as every other CedarLogic, with nothing else to install.

          $ZIPS
          - x64: ordinary PCs and laptops (Intel/AMD)
          - ARM64: Windows on ARM laptops (Snapdragon)

          Unzip one anywhere and double-click CedarLogic.exe inside (the same More info, then Run anyway). The first time, it offers to add itself to the Start menu and open .cdl files.
          EOT
          )
          # The tag moves last. The app's updater goes by it: it asks which
          # commit the tag is on, and downloads the release's zip when that's
          # not its own. Moved first, a copy could be offered this build and
          # be given the last one's zip, still there while these upload.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Native Windows test build" --notes "$NOTES"
          else
            # The first time: the tag is made here, on this commit.
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Native Windows test build" --notes "$NOTES"
          fi
          # The zips (what the updater downloads) before the installers.
          gh release upload "$TAG" zips/*.zip --clobber
          setups=(zips/*.exe)
          if [ ${#setups[@]} -gt 0 ]; then gh release upload "$TAG" "${setups[@]}" --clobber; fi
          # Drop anything this run didn't make, so only the current set is offered.
          keep=$(cd zips && ls -1 *.exe *.zip)
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            echo "$keep" | grep -qxF "$a" || gh release delete-asset "$TAG" "$a" -y
          done
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
