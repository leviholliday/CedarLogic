name: Linux native build

# The native Linux app (linux/): GTK 3 and Cairo on the shared engine, no
# OpenGL. Builds it for both CPUs, runs the engine's headless checks, packages
# an AppImage, starts it on a virtual display, and publishes the pair as a
# rolling test build on pushes to linux/native.

on:
  workflow_dispatch:
  push:
    branches:
      - 'linux/native'
      - 'linux/native-**'

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      # One CPU failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          # PCs and laptops (Intel/AMD).
          - { arch: x86_64,  os: ubuntu-22.04 }
          # Raspberry Pi 4/5 on a 64-bit OS, ARM laptops. Built natively on
          # GitHub's arm64 runners, not cross-compiled.
          - { arch: aarch64, os: ubuntu-22.04-arm }
    # The oldest runners, as glibc and GTK only work forwards: an AppImage built
    # here starts on Ubuntu 22.04, Debian 12 (Raspberry Pi OS Bookworm),
    # Fedora 36 and anything newer.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgtk-3-dev libcairo2-dev libfontconfig1-dev libfreetype-dev libssl-dev \
            curl python3 xvfb xauth xdotool fonts-dejavu-core fonts-liberation

      - name: Build
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build

      # The engine through the C interface the app uses: editing, wires,
      # simulation, truth tables, and saving without changing a circuit.
      # (jmSGTZM is left out of save_check: it reopens identical, but two
      # overlapping dots on one wire draw in the standard library's hash
      # order, a one-shade difference in one pixel.)
      - name: Engine checks
        run: |
          L=res/cl_gatedefs.xml
          B=linux/build
          $B/cl_check $L
          $B/edit_check $L res/samples/practice.cdl 0
          $B/tt_check $L res/samples/practice.cdl 0
          $B/sim_check $L format/tests/fixtures/lab6.cdl 0 before.png after.png
          $B/save_check $L format/tests/fixtures/Broadcast.cdl format/tests/fixtures/Lab5.cdl \
            "format/tests/fixtures/Routing Backwards.cdl" format/tests/fixtures/lab6.cdl res/samples/practice.cdl

      # Sync (docs/SYNC.md): the engine's own self-test with the app's hooks (libcrypto, zlib, the
      # curl program) -- the vectors every device must agree on, and the protocol's scenarios --
      # then the curl program's use (no token on its command line, no temp file left behind), and
      # two libraries turning sync on, linking, editing and deleting through a small stand-in for
      # the website (linux/Tools/sync_mock.py). The website's own mock server, which the full
      # scenarios over HTTP need, is in the private cedarlogic-site repo: SITE=<checkout>
      # linux/Tools/sync-check.sh runs them.
      - name: Sync checks
        run: |
          B=linux/build
          $B/sync_check
          python3 linux/Tools/sync_mock.py --port 0 > mock.log &
          MOCK=$!
          for i in $(seq 1 50); do grep -q listening mock.log && break; sleep 0.2; done
          URL=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' mock.log | sed 's/localhost/127.0.0.1/')
          echo "mock server at $URL"
          $B/sync_check --curl-check "$URL"
          $B/sync_check --roundtrip "$URL"
          kill $MOCK

      - name: Package AppImage
        run: |
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
          chmod +x linuxdeploy
          set -o pipefail
          OUT=$(LINUXDEPLOY="$PWD/linuxdeploy" linux/package.sh linux/build-release | tail -1)
          echo "APPIMAGE=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      # The installer: a .deb with the menu entry, icon and .cdl association.
      - name: Package .deb
        run: |
          set -o pipefail
          DEB=$(linux/package-deb.sh linux/build-release ${{ github.run_number }} | tail -1)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          # An upgrade from every earlier test build (0.1.0+<run number>): this one has to sort higher.
          dpkg --compare-versions "$(dpkg-deb -f "$DEB" Version)" gt "0.1.0+999999"
          mkdir -p debs
          cp "$DEB" "debs/cedarlogic_$(dpkg-deb -f "$DEB" Architecture).deb"
          # It installs, with its dependencies, and runs.
          sudo apt-get install -y "$PWD/$DEB"
          cedarlogic --version
          test -f /usr/share/applications/cedarlogic.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/cedarlogic.png

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Native-linux-deb-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error

      # Start the packaged app on a virtual display, open a circuit and take a
      # picture of the whole window: catches anything the AppImage forgot.
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p renders
          "$APPIMAGE" --version
          "$APPIMAGE" --sync-test
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --screenshot renders/window-Lab5.png format/tests/fixtures/Lab5.cdl
          test -s renders/window-Lab5.png
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --screenshot renders/window-new.png
          test -s renders/window-new.png
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --dark --screenshot renders/window-Lab5-dark.png format/tests/fixtures/Lab5.cdl || true
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --dark --sim-view --screenshot renders/window-sim.png res/samples/practice.cdl || true
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --light --screenshot renders/window-practice.png res/samples/practice.cdl || true
          # The Mac's windows, as ported: one picture each.
          for show in welcome:0 whatsnew:0 whatsnew:1 whatsnew:2 whatsnew:3 whatsnew:4 whatsnew:5 whatsnew:6 help truth feedback templates tour find export report scope focus split quit settings:0 settings:1 settings:2 settings:3 settings:4 settings:5 synccode synclink syncpair:0 syncpair:1 syncpair:2 syncpair:3 syncpair:4 syncpair:5 syncconfirm toolbar:0 toolbar:2 toolbar:3 shortcuts quickadd lock about gatesettings rename ram menu; do
            name=$(echo "$show" | tr ':' '-')
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              timeout 60 "$APPIMAGE" --show "$show" --screenshot "renders/show-$name.png" res/samples/practice.cdl || echo "no $show"
          done
          # Settings > Sync with sync turned on, against the stand-in server: the code is in the
          # sync folder as a turned-on computer has it, and the app syncs while it's pictured.
          python3 linux/Tools/sync_mock.py --port 0 > mock-show.log &
          MOCK=$!
          for i in $(seq 1 50); do grep -q listening mock-show.log && break; sleep 0.2; done
          SYNCURL=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' mock-show.log | sed 's/localhost/127.0.0.1/')
          SYNCHOME=$(mktemp -d)
          mkdir -p "$SYNCHOME/CedarLogic/Sync"
          chmod 700 "$SYNCHOME/CedarLogic/Sync"
          linux/build/sync_check --new-code > "$SYNCHOME/CedarLogic/Sync/secret"
          chmod 600 "$SYNCHOME/CedarLogic/Sync/secret"
          XDG_DATA_HOME="$SYNCHOME" CL_SYNC_URL="$SYNCURL" xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --show sync --screenshot renders/show-sync-on.png res/samples/practice.cdl || echo "no sync-on picture"
          kill $MOCK
          rm -rf "$SYNCHOME"
          # The Raspberry Pi's own look (its PiXflat and PiXnoir themes and the
          # light PibotoLt face, from the Raspberry Pi archive): Settings, the
          # menus and the cards, as they look on a Pi.
          if [ "$(uname -m)" = x86_64 ] &&
             curl -fsSL -o /tmp/piboto.deb http://archive.raspberrypi.org/debian/pool/main/f/fonts-piboto/fonts-piboto_1.2_all.deb &&
             curl -fsSL -o /tmp/pixflat.deb http://archive.raspberrypi.org/debian/pool/main/p/pixflat-theme/pixflat-theme_0.24_amd64.deb; then
            sudo dpkg-deb -x /tmp/piboto.deb / && sudo dpkg-deb -x /tmp/pixflat.deb / && fc-cache -f > /dev/null
            mkdir -p ~/.config/gtk-3.0
            for look in PiXflat:light PiXnoir:dark PiXflat:dark; do
              theme=${look%%:*}; mode=${look##*:}
              printf '[Settings]\ngtk-theme-name=%s\ngtk-font-name=PibotoLt 12\n' "$theme" > ~/.config/gtk-3.0/settings.ini
              for show in settings:0 settings:1 settings:2 settings:3 settings:4 settings:5 menu submenu combo gatesettings rename shortcuts; do
                name=$(echo "$show" | tr ':' '-')
                xvfb-run -a -s "-screen 0 1600x1000x24" \
                  timeout 60 "$APPIMAGE" --$mode --show "$show" --screenshot "renders/pi-$theme-$mode-$name.png" res/samples/practice.cdl || echo "no pi $show"
              done
            done
            rm -f ~/.config/gtk-3.0/settings.ini
          fi
          # The side panel's drag, with a real pointer: press a tile, move onto
          # the canvas and let go in one motion; the gate should be placed.
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            "$APPIMAGE" --hold 9 --screenshot renders/drag-test.png res/samples/practice.cdl &
            app=$!
            sleep 4
            xdotool mousemove 34 158 sleep 0.3 mousedown 1 sleep 0.2
            for x in 60 120 200 320 450 560 640; do xdotool mousemove $x $((300 + x / 4)); sleep 0.08; done
            sleep 0.3
            xdotool mouseup 1
            sleep 0.5
            xdotool mousemove 900 700
            wait $app
          ' || echo "drag test failed"
          for t in 0.5 1.2 2.0; do
            xvfb-run -a -s "-screen 0 1600x1000x24" timeout 30 "$APPIMAGE" --splash-frame $t "renders/splash-$t.png" || echo "no splash $t"
          done
          "$APPIMAGE" --feedback-probe || echo "feedback probe failed"
          linux/build/render_png res/cl_gatedefs.xml format/tests/fixtures/Lab5.cdl 0 renders/Lab5-page1.png
          cp before.png after.png renders/

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Native-linux-appimage-${{ matrix.arch }}
          path: linux/build-release/CedarLogic-Native-*-${{ matrix.arch }}.AppImage
          if-no-files-found: error

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CedarLogic-Native-linux-renders-${{ matrix.arch }}
          path: renders
          if-no-files-found: warn

  # The .deb on the newer systems it has to run on: Ubuntu 24.04 (where OpenSSL's package is named
  # libssl3t64) and Debian 12, which Raspberry Pi OS Bookworm is made from. Installed with its
  # dependencies, started on a virtual display, and sync's self-test run with the system's own
  # libcrypto and curl.
  install-ubuntu-24:
    name: .deb on Ubuntu 24.04 (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CedarLogic-Native-linux-deb-${{ matrix.arch }}
          path: debs
      - name: Install the .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y ./debs/*.deb xvfb curl
          cedarlogic --version
          cedarlogic --sync-test
          dpkg -l | grep -E 'libssl3(t64)?\b'
      - name: Start it
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 cedarlogic --screenshot window.png /usr/share/CedarLogic/samples/practice.cdl
          test -s window.png

  install-debian-12:
    name: .deb on Debian 12 (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    container: debian:12
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CedarLogic-Native-linux-deb-${{ matrix.arch }}
          path: debs
      - name: Install the .deb
        run: |
          apt-get update
          apt-get install -y ./debs/*.deb xvfb curl
          cedarlogic --version
          cedarlogic --sync-test
      - name: Start it
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 cedarlogic --screenshot window.png /usr/share/CedarLogic/samples/practice.cdl
          test -s window.png

  # A public download for testers without a GitHub account: one rolling
  # pre-release, replaced on every push to linux/native. Its own job, after
  # both builds, so the release only ever holds a matching pair.
  publish:
    needs: build
    if: github.ref == 'refs/heads/linux/native'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download both AppImages
        uses: actions/download-artifact@v8
        with:
          pattern: CedarLogic-Native-linux-appimage-*
          path: appimages
          merge-multiple: true

      - name: Download both .debs
        uses: actions/download-artifact@v8
        with:
          pattern: CedarLogic-Native-linux-deb-*
          path: appimages
          merge-multiple: true

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la appimages
          TAG=linux-native-testing
          NOTES=$(cat <<EOT
          Native Linux test build from linux/native (${GITHUB_SHA::7}). Not a release: expect missing pieces.

          This is CedarLogic rebuilt natively for Linux, the way the Mac app was: GTK and Cairo on the same engine as every other CedarLogic, with no OpenGL at all, so it draws the same on a Raspberry Pi as on a PC.

          Easiest (Raspberry Pi OS, Ubuntu, Debian, Mint): paste this into a terminal. It installs CedarLogic with its icon in the applications menu, and it keeps itself up to date:

              curl -fsSL https://github.com/leviholliday/CedarLogic/releases/download/linux-native-testing/install.sh | bash

          Or download the installer for your computer and double-click it (or run sudo apt install ./cedarlogic_arm64.deb):
          - cedarlogic_arm64.deb: Raspberry Pi 4/5 on 64-bit Raspberry Pi OS, ARM laptops
          - cedarlogic_amd64.deb: ordinary PCs and laptops (Intel/AMD)

          Other distros (Fedora, Arch...): the AppImage, one file with nothing to install. Make it executable once (chmod +x, or Properties > Allow executing) and run it; it adds itself to the applications menu. x86_64 for PCs, aarch64 for ARM. If it won't open, install FUSE 2 (Fedora: sudo dnf install fuse; Arch: sudo pacman -S fuse2; Ubuntu 24.04 and newer: sudo apt install libfuse2t64). Without FUSE it has to start with --appimage-extract-and-run on the end every time: run it that way from a terminal, and the applications-menu entry it adds (and .cdl files opened from the file manager) start it that way too.

          Needs Ubuntu 22.04, Debian 12 (Raspberry Pi OS Bookworm), Fedora 36 or newer.
          EOT
          )
          # The very first time, the release (and its tag) start here.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release create "$TAG" --prerelease --title "Native Linux test build" --notes "$NOTES"
          fi
          cp linux/install.sh appimages/install.sh
          gh release upload "$TAG" appimages/*.AppImage appimages/*.deb appimages/install.sh --clobber
          # Drop anything this run didn't make (older versions), so only the
          # current pair is offered.
          keep=$(cd appimages && ls *.AppImage *.deb install.sh)
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            echo "$keep" | grep -qxF "$a" || gh release delete-asset "$TAG" "$a" -y
          done
          # The tag moves last: the apps' update check compares its commit
          # with their own, so they see the new build only once its files
          # are all there.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          gh release edit "$TAG" --prerelease --title "Native Linux test build" --notes "$NOTES"
