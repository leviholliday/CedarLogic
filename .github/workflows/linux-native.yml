name: Linux native build

# The native Linux app (linux/): GTK 3 and Cairo on the shared engine, no
# OpenGL. Builds it for both CPUs, runs the engine's headless checks, packages
# an AppImage, starts it on a virtual display, and publishes the pair as a
# rolling test build on pushes to linux/native.

on:
  workflow_dispatch:
  push:
    branches:
      - 'linux/native'
      - 'linux/native-**'

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      # One CPU failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          # PCs and laptops (Intel/AMD).
          - { arch: x86_64,  os: ubuntu-22.04 }
          # Raspberry Pi 4/5 on a 64-bit OS, ARM laptops. Built natively on
          # GitHub's arm64 runners, not cross-compiled.
          - { arch: aarch64, os: ubuntu-22.04-arm }
    # The oldest runners, as glibc and GTK only work forwards: an AppImage built
    # here starts on Ubuntu 22.04, Debian 12 (Raspberry Pi OS Bookworm),
    # Fedora 36 and anything newer.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the build number is the commit count, as on the
          # Mac and Windows (usage stats send it: docs/PRIVACY.md).
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgtk-3-dev libcairo2-dev libfontconfig1-dev libfreetype-dev libssl-dev \
            curl python3 xvfb xauth xdotool fonts-dejavu-core fonts-liberation \
            gnome-keyring dbus weston

      - name: Build
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build

      # How long the intro's frames take to draw (linux/App/Splash.h, --intro-bench): every
      # frame at 60 fps, as its window draws them, at 1280x800 and 1920x1080 at scale 1, by
      # phase and by part. Numbers to read (the runners are shared and noisy): it never
      # fails the build. A Raspberry Pi 4 is about 3-4 times slower than the arm64 runner.
      - name: Intro benchmark (numbers only)
        continue-on-error: true
        run: |
          mkdir -p renders bench-res
          cp res/cl_gatedefs.xml res/FirstLaunch.wav linux/res/cedarlogic.png mac/App/LaunchIcon.png bench-res/
          env -u DISPLAY -u WAYLAND_DISPLAY CEDARLOGIC_RESOURCES="$PWD/bench-res" timeout 600 \
            linux/build/cedarlogic --intro-bench 1280x800 1920x1080 2>&1 | tee renders/intro-bench.txt

      # Signed updates (update-signing/UpdateSignature.h): the signature check on RFC 8032's
      # vectors and the ways a signature must fail; the one public key everywhere it's written
      # down (the app, the signing script, install.sh); the updater's own code against fake
      # releases (good, bad signature, stale manifest, wrong hash, downgrade...) and the .deb's
      # root step; and the signing script's dry run, with a throwaway key, checked by the app.
      - name: Signed update checks
        run: |
          B=linux/build
          $B/verify_check
          KEY=$($B/verify_check --print-key)
          echo "public key: $KEY"
          grep -qx "PUBHEX=$KEY" scripts/sign-preview.sh || { echo "::error::sign-preview.sh has another public key"; exit 1; }
          INSTALL_KEY=$(sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' linux/install.sh | openssl pkey -pubin -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          [ "$INSTALL_KEY" = "$KEY" ] || { echo "::error::install.sh has another public key ($INSTALL_KEY)"; exit 1; }
          $B/cedarlogic --update-self-test
          # The signing script's manifest and openssl signature, read by the app's own check.
          mkdir -p fake-release
          printf 'a .deb for the test\n' > fake-release/cedarlogic_amd64.deb
          printf 'an AppImage for the test\n' > fake-release/CedarLogic-Native-0.4.0-x86_64.AppImage
          TEST_KEY=$(scripts/sign-preview.sh --dry-run fake-release --tag linux-native-testing --commit "$GITHUB_SHA" --build 2 --test-key)
          $B/cedarlogic --update-self-test --release fake-release --key "$TEST_KEY"
          # Not with the real key (the test key signed it), and not once a file has changed.
          if $B/cedarlogic --update-self-test --release fake-release --key "$KEY"; then echo "::error::verified with the wrong key"; exit 1; fi
          printf 'changed\n' >> fake-release/cedarlogic_amd64.deb
          if $B/cedarlogic --update-self-test --release fake-release --key "$TEST_KEY"; then echo "::error::a changed file passed"; exit 1; fi
          # A versioned release signed the way packaging/sign-release.sh signs one (sign-preview.sh's
          # --dry-run with the release's tag), read by a Normal tester's check; not under another tag.
          mkdir -p fake-v041
          printf 'a .deb for the test\n' > fake-v041/cedarlogic_0.4.1_amd64.deb
          printf 'an arm .deb for the test\n' > fake-v041/cedarlogic_0.4.1_arm64.deb
          printf 'a DMG for the test\n' > fake-v041/CedarLogic-0.4.1-Mac.dmg
          REL_KEY=$(scripts/sign-preview.sh --dry-run fake-v041 --tag v0.4.1 --commit "$GITHUB_SHA" --build 2 --test-key)
          $B/cedarlogic --update-self-test --release fake-v041 --key "$REL_KEY" --tag v0.4.1
          if $B/cedarlogic --update-self-test --release fake-v041 --key "$REL_KEY" --tag v0.4; then echo "::error::a v0.4.1 list passed as v0.4's"; exit 1; fi

      # The testing groups (Settings > General > Testing group, linux/App/Updater.h), through the
      # updater's own check and curl against a static stand-in for GitHub: Normal takes the newest
      # full release and ignores pre-releases, Beta takes the test build, no downgrade on a switch,
      # the group a copy starts in (test-build copies stay Beta), bad signatures refused.
      - name: Testing group check
        run: |
          D=$(mktemp -d)
          mkdir -p "$D/www"
          python3 -m http.server 8767 --bind 127.0.0.1 --directory "$D/www" > "$D/http.log" 2>&1 &
          SERVER=$!
          for _ in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8767/ && break; sleep 0.1; done
          rc=0
          XDG_CONFIG_HOME="$D/config" timeout 120 linux/build/cedarlogic --channel-check --server http://127.0.0.1:8767 --root "$D/www" || rc=$?
          kill $SERVER || true
          [ "$rc" = 0 ] || tail -40 "$D/http.log"
          exit $rc

      # Send Feedback's client against the Mac's stand-in for the site's /api/feedback
      # (mac/Tools/feedback-check/server.py): the install id, the required summary, the
      # daily cap (asked once, not retried), Request more, plain 429s still retried.
      - name: Feedback client check
        run: |
          D=$(mktemp -d)
          python3 mac/Tools/feedback-check/server.py "$D/port" &
          SERVER=$!
          for _ in $(seq 50); do [ -s "$D/port" ] && break; sleep 0.1; done
          rc=0
          XDG_CONFIG_HOME="$D/config" CL_FEEDBACK_URL="http://127.0.0.1:$(cat "$D/port")" CL_FEEDBACK_KEY=check \
            timeout 120 linux/build/cedarlogic --feedback-check || rc=$?
          kill $SERVER || true
          exit $rc

      # Usage stats (linux/App/UsageReport.h) against the Mac's stand-in for the site's
      # /api/usage (mac/Tools/usage-check/server.py, told to expect platform linux): snapshot
      # first, delta, ping, haveSnapshot false, 7 kept while it's down, 429, retries, DELETE
      # (and later when offline), policy off, the caps, no Origin header, the 0600 file, and
      # the leak scan of real reports (home folder, user and real name, host name, recent
      # files, names, codes). One report of each kind goes into the renders. Nothing real is
      # sent: the live draft was checked by hand once (--usage-live).
      - name: Usage stats check
        run: |
          mkdir -p renders/privacy
          D=$(mktemp -d)
          python3 mac/Tools/usage-check/server.py "$D/port" &
          SERVER=$!
          for _ in $(seq 50); do [ -s "$D/port" ] && break; sleep 0.1; done
          rc=0
          XDG_CONFIG_HOME="$D/config" CL_USAGE_URL="http://127.0.0.1:$(cat "$D/port")" USAGE_SAMPLES="$PWD/renders/privacy/usage-samples.txt" \
            timeout 180 linux/build/cedarlogic --usage-check || rc=$?
          kill $SERVER || true
          exit $rc

      # Recently Deleted's files (docs/RECENTLY-DELETED.md), as the Mac's launch-selftest
      # `trash` state: the list, the 30-day sweep, Restore and Delete Now, in a library of its own.
      - name: Recently Deleted check
        run: |
          D=$(mktemp -d)
          XDG_DATA_HOME="$D/data" XDG_CONFIG_HOME="$D/config" timeout 60 linux/build/cedarlogic --trash-check

      # The Actions rail's list (linux/App/Actions.h), as the Mac's launch-selftest `actions`
      # state: where it starts for a new install and for someone who used CedarLogic
      # before, one order shared by a drag on the rail and the Customize list, the search,
      # the hot strip at the window's edge and its timing (dwell, pass-through, leaving,
      # menu, drag, Escape), and focus mode folding it rather than hiding it. Settings of
      # its own in a temporary folder. (The same, live in a window, is in the session check.)
      - name: Actions rail check
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 linux/build/cedarlogic --actions-check

      # The intro's rules (linux/App/Intro.h), as the Mac's launch-selftest: the timelines
      # (the full intro 6.07 s, the panel held 1.1 s; the short one 3.55 s), which launch plays
      # which intro, the sound (the first launch's and an update's, never another launch's),
      # Settings' "When CedarLogic opens" (Short intro for a new install; settled once from
      # 0.3's checkbox; Full intro, Classic launch screen and None kept), Help > Play the Intro
      # and Help > Learn Logic Online... (in the actions and the menu bar). Settings of its own
      # in a temporary folder.
      - name: Intro check
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 linux/build/cedarlogic --intro-check

      # The engine through the C interface the app uses: editing, wires,
      # simulation, truth tables, and saving without changing a circuit.
      # (jmSGTZM is left out of save_check: it reopens identical, but two
      # overlapping dots on one wire draw in the standard library's hash
      # order, a one-shade difference in one pixel.)
      - name: Engine checks
        run: |
          L=res/cl_gatedefs.xml
          B=linux/build
          $B/cl_check $L
          $B/edit_check $L res/samples/practice.cdl 0
          $B/tt_check $L res/samples/practice.cdl 0
          $B/sim_check $L format/tests/fixtures/lab6.cdl 0 before.png after.png
          $B/save_check $L format/tests/fixtures/Broadcast.cdl format/tests/fixtures/Lab5.cdl \
            "format/tests/fixtures/Routing Backwards.cdl" format/tests/fixtures/lab6.cdl res/samples/practice.cdl
          # The templates this app ships (res/templates, the Mac's own): Step Clock on the
          # flip-flops (manual, running and pulse-button clocks), the examples' second pages,
          # the registers and the Classic Mistakes each do what they say. First: every
          # template index.tsv names is there with its Clock files (50 files in all).
          python3 - <<'PY'
          import os, sys
          d = "res/templates"
          rows = [l.split("\t") for l in open(os.path.join(d, "index.tsv"), encoding="utf-8").read().splitlines() if l]
          want = []
          for f in rows:
              want.append("template-%s.cdl" % f[0])
              choices = f[4] if len(f) > 4 else ""
              want += ["template-%s-%s.cdl" % (f[0], c) for c in ("running", "pulse") if c in choices]
          have = sorted(n for n in os.listdir(d) if n.endswith(".cdl"))
          missing, extra = sorted(set(want) - set(have)), sorted(set(have) - set(want))
          print("%d templates, %d files" % (len(rows), len(have)))
          if missing or extra or len(have) != 50:
              sys.exit("templates: missing %s, not in index.tsv %s" % (missing, extra))
          PY
          for t in clock_check examples_check register_check mistakes_check; do
            $B/$t $L res/templates > $t.log 2>&1 || { cat $t.log; exit 1; }
            echo "$t: $(grep -c '^PASS\|  ok ' $t.log) passed"
          done

      # Sync (docs/SYNC.md): the engine's own self-test with the app's hooks (libcrypto, zlib, the
      # curl program) -- the vectors every device must agree on, and the protocol's scenarios --
      # then the curl program's use (no token on its command line, no temp file left behind), and
      # two libraries turning sync on, linking, editing and deleting through a small stand-in for
      # the website (linux/Tools/sync_mock.py). The website's own mock server, which the full
      # scenarios over HTTP need, is in the private cedarlogic-site repo: SITE=<checkout>
      # linux/Tools/sync-check.sh runs them.
      - name: Sync checks
        run: |
          B=linux/build
          $B/sync_check
          python3 linux/Tools/sync_mock.py --port 0 > mock.log &
          MOCK=$!
          for i in $(seq 1 50); do grep -q listening mock.log && break; sleep 0.2; done
          URL=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' mock.log | sed 's/localhost/127.0.0.1/')
          echo "mock server at $URL"
          $B/sync_check --curl-check "$URL"
          $B/sync_check --roundtrip "$URL"
          kill $MOCK

      # The sync code as the app keeps it: in the desktop's keyring (libsecret, loaded at run
      # time), here a throwaway GNOME Keyring in a D-Bus session of its own. Without a keyring
      # the check falls back to the file, which would pass too, so insist this one was used.
      - name: Sync code in a keyring
        run: |
          dbus-run-session -- sh -c 'printf throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null && linux/build/sync_check --keyring-check' | tee keyring.log
          ! grep -q "no unlocked keyring" keyring.log

      - name: Package AppImage
        run: |
          # Pinned: the 1-alpha-20251107-1 release (not the moving "continuous"
          # one), and checked against its sha256 before it is ever run.
          case "${{ matrix.arch }}" in
            x86_64)  LD_SHA=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d ;;
            aarch64) LD_SHA=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff ;;
            *) echo "no pinned linuxdeploy for ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${{ matrix.arch }}.AppImage
          echo "$LD_SHA  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          set -o pipefail
          OUT=$(LINUXDEPLOY="$PWD/linuxdeploy" linux/package.sh linux/build-release | tail -1)
          echo "APPIMAGE=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      # The installer: a .deb with the menu entry, icon and .cdl association.
      - name: Package .deb
        run: |
          set -o pipefail
          DEB=$(linux/package-deb.sh linux/build-release ${{ github.run_number }} | tail -1)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          # An upgrade from every earlier test build (0.1.0+<run number>): this one has to sort higher.
          dpkg --compare-versions "$(dpkg-deb -f "$DEB" Version)" gt "0.1.0+999999"
          mkdir -p debs
          cp "$DEB" "debs/cedarlogic_$(dpkg-deb -f "$DEB" Architecture).deb"
          # It installs, with its dependencies, and runs.
          sudo apt-get install -y "$PWD/$DEB"
          cedarlogic --version
          test -f /usr/share/applications/cedarlogic.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/cedarlogic.png

      - name: Upload .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CedarLogic-Native-linux-deb-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error

      # Start the packaged app on a virtual display, open a circuit and take a
      # picture of the whole window: catches anything the AppImage forgot.
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p renders
          "$APPIMAGE" --version
          "$APPIMAGE" --sync-test
          "$APPIMAGE" --update-self-test
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --screenshot renders/window-Lab5.png format/tests/fixtures/Lab5.cdl
          test -s renders/window-Lab5.png
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --screenshot renders/window-new.png
          test -s renders/window-new.png
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --dark --screenshot renders/window-Lab5-dark.png format/tests/fixtures/Lab5.cdl || true
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --dark --sim-view --screenshot renders/window-sim.png res/samples/practice.cdl || true
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --light --screenshot renders/window-practice.png res/samples/practice.cdl || true
          # Labels drawn both ways (linux/SMOOTHNESS.md step 3): on x86_64 each picture
          # below is taken again, straight after, with labels as filled outlines, as
          # before Cairo's cached glyphs were the default (CEDARLOGIC_GLYPH_TEXT=0),
          # into renders/outlines/, to compare pixel by pixel.
          AGAIN_ENV=CEDARLOGIC_GLYPH_TEXT=0 AGAIN_DIR=renders/outlines
          mkdir -p "$AGAIN_DIR"
          again() {
            [ "$(uname -m)" = x86_64 ] || return 0
            local out=$1; shift
            env "$AGAIN_ENV" xvfb-run -a -s "-screen 0 1600x1000x24" \
              timeout 60 "$APPIMAGE" "$@" --screenshot "$AGAIN_DIR/$out" res/samples/practice.cdl > /dev/null 2>&1 || true
          }
          again window-practice.png --light
          # The Mac's windows, as ported: one picture each.
          for show in welcome:0 whatsnew:0 whatsnew:1 whatsnew:2 whatsnew:3 whatsnew:4 whatsnew:5 whatsnew:6 whatsnew:7 help truth feedback feedback:1 feedback:2 feedback:3 feedback:4 feedback:5 switcher templates templates:1 tour find find:1 export report scope focus split quit settings:0 settings:1 settings:2 settings:3 settings:4 settings:5 settings:6 settings:7 welcome:5 privacy privacy:1 whatssent synccode synclink syncpair:0 syncpair:1 syncpair:2 syncpair:3 syncpair:4 syncpair:5 syncconfirm toolbar:0 toolbar:2 toolbar:3 shortcuts quickadd lock about gatesettings rename ram menu menu:1 menu:2 menu:3 menu:4 primary predict:0 predict:1 stepclock:0 stepclock:1 lockinplace:0 lockinplace:1 pagelinks draw:0 draw:1 draw:2 projector:0 projector:1; do
            name=$(echo "$show" | tr ':' '-')
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              timeout 60 "$APPIMAGE" --show "$show" --screenshot "renders/show-$name.png" res/samples/practice.cdl || echo "no $show"
            again "show-$name.png" --show "$show"
          done
          # The Actions rail (linux/App/Rail.h), light and dark, each from a new install's
          # settings (a folder of its own, so none of these changes the next): open with a
          # label (rail-0), folded (1), the tab peeking at the window's edge (2), slid out
          # over the canvas as on hover (3), mid-drag (4), focus mode's quiet tab (5), slid
          # out there (6), a narrow window (7), Simulation View (8), turned off (9), focus
          # mode peeking (10); the Customize window, and searched for "export"; Settings > Actions.
          mkdir -p renders/rail
          for look in light dark; do
            for show in rail:0 rail:1 rail:2 rail:3 rail:4 rail:5 rail:6 rail:7 rail:8 rail:9 rail:10 customize:0 customize:1 settings:4; do
              name=$(echo "$show" | tr ':' '-')
              home=$(mktemp -d)
              XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" xvfb-run -a -s "-screen 0 1600x1000x24" \
                timeout 60 "$APPIMAGE" --$look --show "$show" --screenshot "renders/rail/$name-$look.png" res/samples/practice.cdl || echo "no $show $look"
              rm -rf "$home"
            done
          done
          ls renders/rail
          # Show Me Around (linux/App/ShowMeAround.h), on aarch64 only (x86_64 has the session
          # check to fit in its time; the pictures are the same), light and dark, from a new install's
          # settings: each of its seven stops (walk:N), the first with the Actions panel off
          # (walkoff:0, six stops), each in a 1024x600 window (walksmall:N); and the welcome's
          # Actions panel page (welcome:2), What's New's card for it (whatsnewpanel),
          # Settings > Actions on and off, and About.
          mkdir -p renders/tour
          [ "$(uname -m)" = x86_64 ] && looks= || looks="light dark"
          for look in $looks; do
            for show in walk:0 walk:1 walk:2 walk:3 walk:4 walk:5 walk:6 walkoff:0 walksmall:0 walksmall:1 walksmall:2 walksmall:3 walksmall:4 walksmall:5 walksmall:6 welcome:2 whatsnewpanel whatsnew:4 whatsnew:7 settings:4 settingsoff about; do
              name=$(echo "$show" | tr ':' '-')
              home=$(mktemp -d)
              XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" xvfb-run -a -s "-screen 0 1600x1000x24" \
                timeout 60 "$APPIMAGE" --$look --show "$show" --screenshot "renders/tour/$name-$look.png" res/samples/practice.cdl || echo "no $show $look"
              rm -rf "$home"
            done
          done
          ls renders/tour
          # Send Feedback's recording (linux/App/Capture.h): with no ffmpeg an animated PNG,
          # with ffmpeg an MP4 made from the app's own movie; each checked by the app, then
          # read back by ffprobe. The files go with the renders.
          mkdir -p renders/capture-png renders/capture-mp4
          CL_CAPTURE_NO_FFMPEG=1 xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 120 "$APPIMAGE" --capture-test renders/capture-png res/samples/practice.cdl 2>&1 | tee renders/capture-png/log.txt
          grep -q "capture: recording .* ok" renders/capture-png/log.txt || { echo "::error::the recording (animated PNG) failed"; exit 1; }
          if [ "$(uname -m)" = x86_64 ] && sudo apt-get install -y -qq ffmpeg > /dev/null; then
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              timeout 200 "$APPIMAGE" --capture-test renders/capture-mp4 res/samples/practice.cdl 2>&1 | tee renders/capture-mp4/log.txt
            grep -q "capture: recording .*video/mp4.* ok" renders/capture-mp4/log.txt || { echo "::error::the recording (MP4) failed"; exit 1; }
            for f in renders/capture-png/capture-recording.png renders/capture-mp4/capture-recording.mp4; do
              ffprobe -v error -count_frames -show_entries stream=codec_name,width,height,nb_read_frames "$f" | tee -a renders/capture-mp4/log.txt
              ffmpeg -v error -i "$f" -f null - || { echo "::error::$f doesn't decode"; exit 1; }
            done
          fi
          # Check My Circuit clock pulse by clock pulse, on the 3-bit counter template.
          for show in checkclocked:0 checkclocked:1 checkclocked:2; do
            name=$(echo "$show" | tr ':' '-')
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              timeout 60 "$APPIMAGE" --show "$show" --screenshot "renders/show-$name.png" res/templates/template-builtin-count-3bit.cdl || echo "no $show"
          done
          # A larger circuit (10 switches, a clock, TO labels): the truth table window
          # and the oscilloscope with signals in it, in both themes and Simulation View.
          # What each run said goes with the pictures.
          for run in truth:--light scope:--light scope:--dark scope:--sim-view export:--dark; do
            show=${run%%:*}; flag=${run##*:}
            out="renders/show-$show-Lab5-${flag#--}"
            rc=0
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              timeout 60 "$APPIMAGE" $flag --show "$show" --screenshot "$out.png" format/tests/fixtures/Lab5.cdl > "$out.log" 2>&1 || rc=$?
            echo "Lab5 $show $flag: exit $rc" | tee -a "$out.log"
          done
          # The oscilloscope fills its dock and has Lab5's TO labels in it (it once drew
          # nothing: its area had no height).
          grep -h "oscilloscope:" renders/show-scope-Lab5-*.log || true
          for f in renders/show-scope-Lab5-*.log; do
            grep -Eq "oscilloscope: drawn [0-9]+ x [1-9][0-9]* in .*, [1-9][0-9]* signal" "$f" || { echo "::error::the oscilloscope wasn't drawn ($f)"; exit 1; }
          done
          # Settings > Sync with sync turned on, against the stand-in server: the code is in the
          # sync folder as a turned-on computer has it, and the app syncs while it's pictured.
          python3 linux/Tools/sync_mock.py --port 0 > mock-show.log &
          MOCK=$!
          for i in $(seq 1 50); do grep -q listening mock-show.log && break; sleep 0.2; done
          SYNCURL=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' mock-show.log | sed 's/localhost/127.0.0.1/')
          SYNCHOME=$(mktemp -d)
          mkdir -p "$SYNCHOME/CedarLogic/Sync"
          chmod 700 "$SYNCHOME/CedarLogic/Sync"
          linux/build/sync_check --new-code > "$SYNCHOME/CedarLogic/Sync/secret"
          chmod 600 "$SYNCHOME/CedarLogic/Sync/secret"
          # A second "device" with the same code syncs first (its own folder, settings and name, and
          # the student's name), so the picture lists it with Remove and the name comes across.
          SECOND=$(mktemp -d)
          mkdir -p "$SECOND/data/CedarLogic/Sync" "$SECOND/config/CedarLogic"
          chmod 700 "$SECOND/data/CedarLogic/Sync"
          cp "$SYNCHOME/CedarLogic/Sync/secret" "$SECOND/data/CedarLogic/Sync/secret"
          printf '[CedarLogic]\nstudentName=Robin Lab\nhasSeenWelcome=true\n' > "$SECOND/config/CedarLogic/native.ini"
          XDG_DATA_HOME="$SECOND/data" XDG_CONFIG_HOME="$SECOND/config" CL_SYNC_DEVICE_NAME="Lab PC" CL_SYNC_URL="$SYNCURL" \
            xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 "$APPIMAGE" --hold 15 --screenshot renders/sync-second-device.png \
            res/samples/practice.cdl || echo "no second device"
          rm -rf "$SECOND"
          XDG_DATA_HOME="$SYNCHOME" CL_SYNC_URL="$SYNCURL" xvfb-run -a -s "-screen 0 1600x1000x24" \
            timeout 60 "$APPIMAGE" --show sync --screenshot renders/show-sync-on.png res/samples/practice.cdl || echo "no sync-on picture"
          kill $MOCK
          rm -rf "$SYNCHOME"
          # The Raspberry Pi's own look (its PiXflat and PiXnoir themes and the
          # light PibotoLt face, from the Raspberry Pi archive): Settings, the
          # menus and the cards, as they look on a Pi.
          if [ "$(uname -m)" = x86_64 ] &&
             curl -fsSL -o /tmp/piboto.deb https://archive.raspberrypi.org/debian/pool/main/f/fonts-piboto/fonts-piboto_1.2_all.deb &&
             curl -fsSL -o /tmp/pixflat.deb https://archive.raspberrypi.org/debian/pool/main/p/pixflat-theme/pixflat-theme_0.24_amd64.deb &&
             echo "ae9418e029e654e2fbe9ce33768ea5985fa91441d1f8ac2cf7e015f0f2539fad  /tmp/piboto.deb" | sha256sum -c - &&
             echo "56e518b2321a1784b39566885df595661b99781b26e439dd09a6ba1d56858c66  /tmp/pixflat.deb" | sha256sum -c -; then
            sudo dpkg-deb -x /tmp/piboto.deb / && sudo dpkg-deb -x /tmp/pixflat.deb / && fc-cache -f > /dev/null
            mkdir -p ~/.config/gtk-3.0
            for look in PiXflat:light PiXnoir:dark PiXflat:dark; do
              theme=${look%%:*}; mode=${look##*:}
              printf '[Settings]\ngtk-theme-name=%s\ngtk-font-name=PibotoLt 12\n' "$theme" > ~/.config/gtk-3.0/settings.ini
              for show in settings:0 settings:1 settings:2 settings:3 settings:4 settings:5 settings:6 menu primary submenu combo gatesettings rename shortcuts draw:0; do
                name=$(echo "$show" | tr ':' '-')
                xvfb-run -a -s "-screen 0 1600x1000x24" \
                  timeout 60 "$APPIMAGE" --$mode --show "$show" --screenshot "renders/pi-$theme-$mode-$name.png" res/samples/practice.cdl || echo "no pi $show"
                again "pi-$theme-$mode-$name.png" --$mode --show "$show"
              done
            done
            rm -f ~/.config/gtk-3.0/settings.ini
          fi
          # The side panel's drag, with a real pointer: press a tile, move onto
          # the canvas and let go in one motion; the gate should be placed.
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            "$APPIMAGE" --hold 9 --screenshot renders/drag-test.png res/samples/practice.cdl &
            app=$!
            sleep 4
            xdotool mousemove 34 158 sleep 0.3 mousedown 1 sleep 0.2
            for x in 60 120 200 320 450 560 640; do xdotool mousemove $x $((300 + x / 4)); sleep 0.08; done
            sleep 0.3
            xdotool mouseup 1
            sleep 0.5
            xdotool mousemove 900 700
            wait $app
          ' || echo "drag test failed"
          for t in 0.5 1.2 2.0; do
            xvfb-run -a -s "-screen 0 1600x1000x24" timeout 30 "$APPIMAGE" --splash-frame $t "renders/splash-$t.png" || echo "no splash $t"
          done
          # The 0.4 intro (linux/App/Intro.h), drawn with no display at all: every frame at
          # 60 fps (6.07 s, 365 frames), dissolving into a dark new circuit's window (pictured
          # first), and the moments the Mac's v5 stills show kept with the renders (the panel
          # held at 4.95 s, the dissolve at 5.80 s), and the hit, 2.50-2.70 s. Failing to draw
          # fails the build.
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 "$APPIMAGE" --dark --screenshot renders/window-new-dark.png || true
          behind=; [ -s renders/window-new-dark.png ] && behind="--behind renders/window-new-dark.png"
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 600 "$APPIMAGE" --render-intro intro-frames first $behind
          test "$(ls intro-frames/frame-*.png | wc -l)" -eq 365
          mkdir -p renders/intro
          for f in 0012:0.20s 0057:0.95s 0102:1.70s 0178:2.98s 0192:3.20s 0228:3.80s 0297:4.95s 0348:5.80s \
                   0150:2.50s 0153:2.56s 0156:2.60s 0158:2.64s 0162:2.70s; do
            cp "intro-frames/frame-${f%%:*}.png" "renders/intro/intro-${f#*:}.png"
          done
          rm -rf intro-frames
          # The short intro (every ordinary launch's, unless Settings says otherwise): 3.55 s, 213
          # frames after the first, no panel, its bloom crossfading straight into the window; the
          # LED lit, the beat, the bloom and the crossfade kept.
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 600 "$APPIMAGE" --render-intro intro-frames short $behind
          test "$(ls intro-frames/frame-*.png | wc -l)" -eq 214
          for f in 0156:2.60s 0180:3.00s 0186:3.10s 0192:3.20s 0204:3.40s 0213:3.55s; do
            cp "intro-frames/frame-${f%%:*}.png" "renders/intro/short-${f#*:}.png"
          done
          rm -rf intro-frames
          # And live (CI never plays it by itself): on a virtual display, GTK's warnings
          # fatal, with settings of its own that have seen the welcome and What's New.
          #   play, skip: as at the first launch after the update (CL_INTRO=update), with the
          #     sound; its window up, then gone into the circuit window, the intro marked
          #     played; then again, skipped with a click.
          #   short: nothing owed and nothing chosen ("When CedarLogic opens" is Short intro
          #     to begin with, settled from 0.3's checkbox): the short intro, silently.
          #   every: nothing owed, "When CedarLogic opens: Full intro": the full one, silently,
          #     and the once-only keys are left as they were.
          #   menu: nothing owed, "Classic launch screen": no intro (the launch screen alone);
          #     then Help > Play the Intro (Alt+H, I) plays the first launch's over the circuit
          #     window, with the sound, and goes, the window still there, nothing marked played.
          #   none: nothing owed, "None": no launch screen at all, straight into the window.
          for how in play skip short every menu none; do
            home=$(mktemp -d)
            mkdir -p "$home/config/CedarLogic"
            ini="$home/config/CedarLogic/native.ini"
            # (Show Me Around seen too: these launches are about the intro, and it would start over the window.)
            printf '[CedarLogic]\nhasSeenWelcome=true\nseenWhatsNew=0.4\nlastSeenVersion=0.4\ncheckUpdates=false\nshowMeAroundSeen=true\n' > "$ini"
            forced=update
            case $how in
              short) forced=; printf 'introUpdatePlayed=0.4\nintroEveryLaunch=true\n' >> "$ini" ;;
              every) forced=; printf 'introUpdatePlayed=0.4\nintroAtLaunch=full\n' >> "$ini" ;;
              menu) forced=; printf 'introUpdatePlayed=0.4\nintroAtLaunch=classic\n' >> "$ini" ;;
              none) forced=; printf 'introUpdatePlayed=0.4\nintroAtLaunch=none\n' >> "$ini" ;;
            esac
            HOW=$how xvfb-run -a -s "-screen 0 1600x1000x24" env -u CI ${forced:+CL_INTRO=$forced} CL_INTRO_LOG=1 G_DEBUG=fatal-criticals \
              XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" bash -c '
              up() { xdotool search --onlyvisible --name "$1" > /dev/null 2>&1; }
              "$APPIMAGE" > "renders/intro-live-$HOW.log" 2>&1 &
              app=$!
              if [ "$HOW" = none ]; then
                # Straight in: the circuit window, and never a launch screen.
                for i in $(seq 80); do up " — CedarLogic\$" && break; up "^CedarLogic\$" && break; sleep 0.1; done
                up "^CedarLogic\$" && { echo "a launch screen came up with None ($HOW)"; kill $app; exit 1; }
                up " — CedarLogic\$" || { echo "no circuit window ($HOW)"; kill $app; exit 1; }
                sleep 1
                up "^CedarLogic\$" && { echo "a launch screen came up with None ($HOW)"; kill $app; exit 1; }
                kill $app
                wait $app 2> /dev/null
                exit 0
              fi
              if [ "$HOW" = menu ]; then
                # The launch screen, then the circuit window, and no intro.
                for i in $(seq 80); do up " — CedarLogic\$" && break; sleep 0.25; done
                up " — CedarLogic\$" || { echo "no circuit window ($HOW)"; kill $app; exit 1; }
                for i in $(seq 20); do up "^CedarLogic\$" || break; sleep 0.25; done
                sleep 1
                grep -q "intro:" "renders/intro-live-$HOW.log" && { echo "an intro played at a launch owed none ($HOW)"; kill $app; exit 1; }
                xdotool mousemove 800 500
                sleep 0.3
                xdotool key alt+h
                sleep 0.6
                xdotool key i
              fi
              for i in $(seq 80); do up "^CedarLogic\$" && break; sleep 0.25; done
              up "^CedarLogic\$" || { echo "no intro window ($HOW)"; kill $app; exit 1; }
              # (Its own clock slows it where frames come slowly, as they may on a
              # virtual display: up to 30 s.)
              tries=120
              if [ "$HOW" = skip ]; then sleep 1; xdotool mousemove 800 500 click 1; tries=12; fi
              for i in $(seq $tries); do up "^CedarLogic\$" || break; sleep 0.25; done
              up "^CedarLogic\$" && { echo "the intro window is still up ($HOW)"; kill $app; exit 1; }
              kill -0 $app 2> /dev/null || { echo "CedarLogic ended during the intro ($HOW)"; exit 1; }
              sleep 0.5
              up " — CedarLogic\$" || { echo "no circuit window after the intro ($HOW)"; kill $app; exit 1; }
              kill $app
              wait $app 2> /dev/null
              exit 0
            '
            log="renders/intro-live-$how.log"
            cat "$log"
            case $how in
              play|skip) grep -q "^introUpdatePlayed=0.4" "$ini"; grep -q "intro: update, with the sound" "$log" ;;
              short) grep -q "intro: short, silent" "$log"; grep -q "^introAtLaunch=short" "$ini" ;;
              every) grep -q "intro: every, silent" "$log"; grep -q "^introAtLaunch=full" "$ini" ;;
              none) grep -q "intro: straight in: no launch screen" "$log"
                    if grep -q "intro: [a-z]*, " "$log"; then echo "an intro played with None"; exit 1; fi ;;
              menu) grep -q "intro: first, from the menu, with the sound" "$log" ;;
            esac
            if grep -q "^introFirstLaunchPlayed=true" "$ini"; then echo "the first launch's intro was marked played ($how)"; exit 1; fi
            echo "intro live ($how): ok"
            rm -rf "$home"
          done
          "$APPIMAGE" --feedback-probe || echo "feedback probe failed"
          linux/build/render_png res/cl_gatedefs.xml format/tests/fixtures/Lab5.cdl 0 renders/Lab5-page1.png
          # The canvas alone, both ways, with nothing running (the same picture every time):
          # light at 2x, and the dark and print exports.
          for f in format/tests/fixtures/Lab5.cdl format/tests/fixtures/lab6.cdl format/tests/fixtures/jmSGTZM.cdl res/samples/practice.cdl; do
            n=$(basename "$f" .cdl)
            for look in screen dark print; do
              fit=; [ $look = screen ] || fit=CL_RENDER_FITTED=$look
              env $fit linux/build/render_png res/cl_gatedefs.xml "$f" 0 "renders/canvas-$n-$look.png" > /dev/null
              env "$AGAIN_ENV" $fit linux/build/render_png res/cl_gatedefs.xml "$f" 0 "$AGAIN_DIR/canvas-$n-$look.png" > /dev/null
            done
          done
          cp before.png after.png renders/

      # How smooth dragging is (linux/SMOOTHNESS.md): ms per frame while
      # dragging one gate, everything, and the view, on a large circuit. Only
      # numbers to read: GitHub's runners are shared and noisy, so this never
      # fails the build. The output goes with the renders.
      - name: Drag benchmark (numbers only)
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p renders
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 300 "$APPIMAGE" \
            --bench-drag 60 format/tests/fixtures/lab6.cdl 2>&1 | tee renders/bench-drag.txt || true
          # Labels as filled outlines, as before Cairo's cached glyphs were the default
          # (CEDARLOGIC_GLYPH_TEXT=0): the same benchmark, to compare.
          CEDARLOGIC_GLYPH_TEXT=0 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 300 "$APPIMAGE" \
            --bench-drag 60 format/tests/fixtures/lab6.cdl 2>&1 | tee renders/bench-drag-outlines.txt || true
          # Lab5 (53 gates, 40 wires), the circuit of the Zorin OS desktop test (linux/DESKTOP-TEST.md).
          # The frames it compares (layered and drawn whole, one gate and everything moved)
          # go with the renders, to look at.
          mkdir -p renders/bench-Lab5
          CEDARLOGIC_BENCH_PICTURES=renders/bench-Lab5 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 300 "$APPIMAGE" \
            --bench-drag 60 format/tests/fixtures/Lab5.cdl 2>&1 | tee renders/bench-drag-Lab5.txt || true
          CEDARLOGIC_GLYPH_TEXT=0 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 300 "$APPIMAGE" \
            --bench-drag 60 format/tests/fixtures/Lab5.cdl 2>&1 | tee renders/bench-drag-Lab5-outlines.txt || true

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CedarLogic-Native-linux-appimage-${{ matrix.arch }}
          path: linux/build-release/CedarLogic-Native-*-${{ matrix.arch }}.AppImage
          if-no-files-found: error

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CedarLogic-Native-linux-renders-${{ matrix.arch }}
          path: renders
          if-no-files-found: warn
  # The windows' checks, beside the build (each job builds the app again: two
  # minutes, quicker than waiting for it): Settings and Customize Actions on
  # small screens, X11 and Wayland, and every menu's text.
  settings:
    name: Settings and menus (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-22.04 }
          - { arch: aarch64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgtk-3-dev libcairo2-dev libfontconfig1-dev libfreetype-dev libssl-dev \
            curl python3 xvfb xauth xdotool fonts-dejavu-core fonts-liberation \
            gnome-keyring dbus weston

      - name: Build
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCL_BUILD_TOOLS=OFF
          cmake --build linux/build

      # Settings on small screens (linux/App/SettingsCheck.cpp): every page and Customize
      # Actions on the Raspberry Pi touchscreen's 800x480, 1024x600 and 1280x720, in a light and
      # a dark GTK theme forced on the app (GTK_THEME, so it can't swap it for its own: the
      # worst case), with the app light and dark; on x86_64 also the Pi's PiXflat and PiXnoir in
      # its PibotoLt font, and Ubuntu's Yaru-dark. Each window fits the screen (with room for a
      # panel the desktop doesn't report), every page is the same width, its text reads at
      # 4.5:1 or better, and the mouse wheel over a dropdown, number box, slider or switch
      # scrolls the page instead of changing the setting. The whole screen is pictured each
      # time, into renders/settings (uploaded straight away, as its own artifact).
      - name: Settings check
        run: |
          mkdir -p renders/settings
          pi=
          if [ "$(uname -m)" = x86_64 ] &&
             curl -fsSL -o /tmp/piboto.deb https://archive.raspberrypi.org/debian/pool/main/f/fonts-piboto/fonts-piboto_1.2_all.deb &&
             curl -fsSL -o /tmp/pixflat.deb https://archive.raspberrypi.org/debian/pool/main/p/pixflat-theme/pixflat-theme_0.24_amd64.deb &&
             echo "ae9418e029e654e2fbe9ce33768ea5985fa91441d1f8ac2cf7e015f0f2539fad  /tmp/piboto.deb" | sha256sum -c - &&
             echo "56e518b2321a1784b39566885df595661b99781b26e439dd09a6ba1d56858c66  /tmp/pixflat.deb" | sha256sum -c -; then
            sudo dpkg-deb -x /tmp/piboto.deb / && sudo dpkg-deb -x /tmp/pixflat.deb / && fc-cache -f > /dev/null && pi=1
          fi
          yaru=
          [ "$(uname -m)" = x86_64 ] && sudo apt-get install -y -qq yaru-theme-gtk > /dev/null 2>&1 && yaru=1
          fails=0
          # run <WxH> <GTK_THEME> <font or -> <light|dark>
          run() {
            local size=$1 theme=$2 font=$3 look=$4
            local tag="$size-$(echo "$theme" | tr ':' '-')-app-$look"
            local home
            home=$(mktemp -d)
            mkdir -p "$home/config/gtk-3.0"
            [ "$font" = - ] || printf '[Settings]\ngtk-font-name=%s\n' "$font" > "$home/config/gtk-3.0/settings.ini"
            if ! XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" GTK_THEME="$theme" \
                 xvfb-run -a -s "-screen 0 ${size}x24" timeout 120 linux/build/cedarlogic --$look \
                 --settings-check renders/settings "$tag" res/samples/practice.cdl > "renders/settings/$tag.log" 2>&1; then
              fails=$((fails + 1))
              echo "::error::Settings check failed: $tag"
            fi
            grep -E "^(FAIL|  )|settings-check:" "renders/settings/$tag.log" || true
            rm -rf "$home"
          }
          if [ "$(uname -m)" = x86_64 ]; then
            for size in 800x480 1024x600 1280x720; do
              for theme in Adwaita Adwaita:dark; do
                for look in light dark; do run $size $theme - $look; done
              done
              if [ -n "$pi" ]; then for look in light dark; do run $size PiXflat "PibotoLt 12" $look; done; fi
            done
            if [ -n "$pi" ]; then for look in light dark; do run 1024x600 PiXnoir "PibotoLt 12" $look; done; fi
            if [ -n "$yaru" ]; then for look in light dark; do run 1024x600 Yaru-dark - $look; done; fi
          else
            for theme in Adwaita Adwaita:dark; do
              for look in light dark; do run 800x480 $theme - $look; done
            done
          fi
          # Under Wayland too (Raspberry Pi OS Bookworm's desktop is Wayland, where the desktop,
          # not the app, places windows): weston with no screen, at each size. A window's place
          # can't be read there, so the check is that all of it (its own title bar, and room for
          # one the desktop may draw and for a panel it doesn't report) fits the screen.
          if command -v weston > /dev/null; then
            for size in 800x480 1024x600 1280x720; do
              rt=$(mktemp -d); chmod 700 "$rt"
              XDG_RUNTIME_DIR=$rt weston --backend=headless-backend.so --width=${size%x*} --height=${size#*x} \
                --socket=wayland-cl --idle-time=0 > "renders/settings/weston-$size.log" 2>&1 &
              wpid=$!
              for i in $(seq 50); do [ -S "$rt/wayland-cl" ] && break; sleep 0.2; done
              for look in light dark; do
                tag="$size-wayland-app-$look"
                home=$(mktemp -d)
                if ! XDG_RUNTIME_DIR=$rt WAYLAND_DISPLAY=wayland-cl GDK_BACKEND=wayland XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" \
                     env -u DISPLAY timeout 120 linux/build/cedarlogic --$look --settings-check renders/settings "$tag" res/samples/practice.cdl \
                     > "renders/settings/$tag.log" 2>&1; then
                  fails=$((fails + 1))
                  echo "::error::Settings check failed: $tag"
                fi
                grep -E "^(FAIL|  )|settings-check:" "renders/settings/$tag.log" || true
                rm -rf "$home"
              done
              kill $wpid 2> /dev/null; wait $wpid 2> /dev/null
              rm -rf "$rt"
            done
          else
            echo "::warning::no weston here: the Wayland Settings check didn't run"
          fi
          ls renders/settings | head -400
          [ "$fails" = 0 ] || { echo "::error::$fails Settings check run(s) failed"; exit 1; }

      # Every menu's text, read off the screen as GTK draws it (linux/App/SettingsCheck.cpp's
      # menuCheck), as it is and lit with the pointer on it: the menu bar's titles, each menu
      # and its submenus, the canvas's and a part's right-click menus, a menu of every kind of
      # row, a dropdown's list and a menu as a popover, at 4.5:1 or better; in the same themes
      # as the Settings check (forced on the app with GTK_THEME), with the app light and dark.
      # Pictures of the open menus go with the Settings pictures.
      - name: Menu check
        if: ${{ !cancelled() }}
        run: |
          mkdir -p renders/settings
          fails=0
          menus() {
            local theme=$1 font=$2 look=$3
            local tag="menus-$(echo "$theme" | tr ':' '-')-app-$look"
            local home
            home=$(mktemp -d)
            mkdir -p "$home/config/gtk-3.0"
            [ "$font" = - ] || printf '[Settings]\ngtk-font-name=%s\n' "$font" > "$home/config/gtk-3.0/settings.ini"
            if ! XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" GTK_THEME="$theme" \
                 xvfb-run -a -s "-screen 0 1280x720x24" timeout 180 linux/build/cedarlogic --$look \
                 --menu-check renders/settings "$tag" res/samples/practice.cdl > "renders/settings/$tag.log" 2>&1; then
              fails=$((fails + 1))
              echo "::error::Menu check failed: $tag"
            fi
            grep -E "^(FAIL|  )|menu-check:" "renders/settings/$tag.log" || true
            rm -rf "$home"
          }
          for theme in Adwaita Adwaita:dark; do for look in light dark; do menus $theme - $look; done; done
          if [ -d /usr/share/themes/PiXflat ]; then
            for theme in PiXflat PiXnoir; do for look in light dark; do menus $theme "PibotoLt 12" $look; done; done
          fi
          if [ -d /usr/share/themes/Yaru-dark ]; then for look in light dark; do menus Yaru-dark - $look; done; fi
          [ "$fails" = 0 ] || { echo "::error::$fails Menu check run(s) failed"; exit 1; }

      # Crash reports' and usage stats' one consent (linux/App/PrivacyCheck.h) in real windows,
      # clicked with the real pointer (xdotool): the Mac's consent sheet crashed on a real
      # window, so this is never only a picture. The welcome's "A small favour" (No thanks),
      # the updaters' sheet after What's New and before Show Me Around (Yes), Escape, Choose
      # what to send and its switches, See exactly what's sent, asked once, each answer saved
      # in native.ini; on a big screen and on the Raspberry Pi touchscreen's 800x480 (where
      # they scroll). Then a lab's /etc/cedarlogic/policy.ini (a stand-in, CL_POLICY_FILE)
      # turning both off: nobody asked, nothing counted, Settings > Privacy greyed out.
      - name: Privacy consent check
        if: ${{ !cancelled() }}
        run: |
          mkdir -p renders/settings
          fails=0
          consent() {
            local tag=$1 size=$2; shift 2
            local home
            home=$(mktemp -d)
            if ! env NO_AT_BRIDGE=1 XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" "$@" \
                 xvfb-run -a -s "-screen 0 ${size}x24" timeout 180 linux/build/cedarlogic --privacy-check res/samples/practice.cdl \
                 > "renders/settings/privacy-$tag.log" 2>&1; then
              fails=$((fails + 1))
              echo "::error::Privacy consent check failed: $tag"
            fi
            grep -E "^(PASS|FAIL|privacy|     )" "renders/settings/privacy-$tag.log" || tail -20 "renders/settings/privacy-$tag.log"
            if grep -E "(CRITICAL|WARNING) \*\*" "renders/settings/privacy-$tag.log"; then echo "::warning::GTK warnings in the privacy check ($tag)"; fi
            rm -rf "$home"
          }
          consent 1600x1000 1600x1000
          consent 800x480 800x480
          P=$(mktemp -d)
          printf '# A lab'"'"'s policy (the stand-in for /etc/cedarlogic/policy.ini)\n[Policy]\nDisableCrashReporting=true\nDisableUsageStats=true\n' > "$P/policy.ini"
          consent policy 1600x1000 CL_POLICY_FILE="$P/policy.ini" CL_EXPECT_POLICY=1
          [ "$fails" = 0 ] || { echo "::error::$fails privacy consent check run(s) failed"; exit 1; }

      - name: Upload the Settings pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CedarLogic-Native-linux-settings-${{ matrix.arch }}
          path: renders/settings
          if-no-files-found: warn

  # The working session in the window, beside the build too.
  session:
    name: session check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-22.04 }
          - { arch: aarch64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgtk-3-dev libcairo2-dev libfontconfig1-dev libfreetype-dev libssl-dev \
            curl python3 xvfb xauth xdotool fonts-dejavu-core fonts-liberation \
            gnome-keyring dbus weston

      - name: Build
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCL_BUILD_TOOLS=OFF
          cmake --build linux/build

      # A long working session in the window (linux/App/SessionCheck.cpp): seeded
      # random clicks, drags, keys and commands through the app's own handlers, with
      # windows over it poked at and closed, checked all along (no crash or GTK
      # warning, autosave, the file on disk, undo and redo, tabs and split view,
      # memory, the window freed on close). Seeds 1-4, then again with
      # G_DEBUG=fatal-criticals; each run capped at 7 minutes. A FAIL fails the build.
      - name: Session check
        if: matrix.arch == 'x86_64'
        timeout-minutes: 35
        run: |
          SESSION_LOGS=session-logs linux/Tools/session-check.sh linux/build/cedarlogic 300 1 2 3 4

      # On the other CPU, a short session: the checks it starts with (the canvas at the
      # window's right edge with the real pointer, the Actions panel) and a few actions.
      - name: Session check, short
        if: matrix.arch != 'x86_64'
        timeout-minutes: 15
        run: |
          SESSION_LOGS=session-logs linux/Tools/session-check.sh linux/build/cedarlogic 20 2

      - name: Upload the session logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CedarLogic-Native-linux-session-logs${{ matrix.arch != 'x86_64' && format('-{0}', matrix.arch) || '' }}
          path: session-logs
          if-no-files-found: warn


  # The same session with AddressSanitizer and UndefinedBehaviorSanitizer in the
  # app and the engine: memory used after it's freed, or read past its end, is
  # reported where it happens instead of crashing later (or never). Other seeds
  # than the build's, so between them seeds 1-8 run on every push.
  session-sanitizers:
    name: session check with sanitizers (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgtk-3-dev libcairo2-dev libfontconfig1-dev libfreetype-dev libssl-dev \
            xvfb xauth xdotool fonts-dejavu-core fonts-liberation
      - name: Build with sanitizers
        run: |
          cmake -S linux -B linux/build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCL_BUILD_TOOLS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build linux/build-asan
      - name: Session check with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1
          UBSAN_OPTIONS: print_stacktrace=1
          SESSION_TIMEOUT: 900
        run: |
          SESSION_LOGS=session-logs-asan linux/Tools/session-check.sh linux/build-asan/cedarlogic 200 5 6 7 8
      # Further seeds, to find what's left: read, never failing the build.
      - name: Session check with sanitizers, more seeds (numbers only)
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1
          UBSAN_OPTIONS: print_stacktrace=1
          SESSION_TIMEOUT: 900
        run: |
          SESSION_LOGS=session-logs-asan/more linux/Tools/session-check.sh linux/build-asan/cedarlogic 200 9 10 11 12
      - name: Upload the session logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CedarLogic-Native-linux-session-logs-asan
          path: session-logs-asan
          if-no-files-found: warn

  # The .deb on the newer systems it has to run on: Ubuntu 24.04 (where OpenSSL's package is named
  # libssl3t64) and Debian 12, which Raspberry Pi OS Bookworm is made from. Installed with its
  # dependencies, started on a virtual display, and sync's self-test run with the system's own
  # libcrypto and curl.
  install-ubuntu-24:
    name: .deb on Ubuntu 24.04 (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CedarLogic-Native-linux-deb-${{ matrix.arch }}
          path: debs
      # The one-line install (linux/install.sh) against a fake release on this machine, signed
      # by the signing script's dry run with a throwaway key: it installs the signed .deb, and
      # refuses a changed .deb or a bad signature without installing anything.
      - name: install.sh, against a signed fake release
        run: |
          sudo apt-get update
          mkdir -p fake
          cp debs/*.deb linux/install.sh fake/
          DEB=$(cd fake && ls *.deb)
          cp "fake/$DEB" pristine.deb
          scripts/sign-preview.sh --dry-run fake --tag linux-native-testing --commit "$GITHUB_SHA" --build 2 --test-key > /dev/null
          (cd fake && exec python3 -m http.server 8765 --bind 127.0.0.1) > http.log 2>&1 &
          for i in $(seq 1 50); do curl -fs -o /dev/null http://127.0.0.1:8765/SHA256SUMS && break; sleep 0.2; done
          export CEDARLOGIC_TEST_RELEASE=http://127.0.0.1:8765 CEDARLOGIC_TEST_KEY=$PWD/fake/test-key.pub.pem
          bash linux/install.sh
          cedarlogic --version
          sudo apt-get remove -y cedarlogic
          # A .deb that isn't the one signed for.
          printf 'x' >> "fake/$DEB"
          if bash linux/install.sh; then echo "::error::install.sh installed a changed .deb"; exit 1; fi
          if dpkg-query -W -f='${Status}' cedarlogic 2>/dev/null | grep -q "ok installed" || [ -e /usr/bin/cedarlogic ]; then echo "::error::cedarlogic got installed"; exit 1; fi
          cp pristine.deb "fake/$DEB"
          # A bad signature.
          python3 -c "import sys; p='fake/SHA256SUMS.sig'; b=bytearray(open(p,'rb').read()); b[7]^=1; open(p,'wb').write(b)"
          if bash linux/install.sh; then echo "::error::install.sh took a bad signature"; exit 1; fi
          if dpkg-query -W -f='${Status}' cedarlogic 2>/dev/null | grep -q "ok installed" || [ -e /usr/bin/cedarlogic ]; then echo "::error::cedarlogic got installed"; exit 1; fi
          if ls /var/tmp | grep cedarlogic; then echo "::error::a root copy was left behind"; exit 1; fi
      - name: Install the .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y ./debs/*.deb xvfb curl
          cedarlogic --version
          cedarlogic --sync-test
          cedarlogic --update-self-test
          dpkg -l | grep -E 'libssl3(t64)?\b'
          # The .deb update's root step, for real as root: something unsigned is refused (3),
          # with nothing left behind; and it won't run as anyone else.
          printf 'not a package' > /tmp/x.deb
          printf 'not a manifest\n' > /tmp/m
          head -c 64 /dev/zero > /tmp/s
          code=0; sudo cedarlogic --install-update /tmp/x.deb /tmp/m /tmp/s "cedarlogic_$(dpkg --print-architecture).deb" || code=$?
          [ "$code" = 3 ] || { echo "::error::the root step answered $code to an unsigned file"; exit 1; }
          code=0; cedarlogic --install-update /tmp/x.deb /tmp/m /tmp/s "cedarlogic_$(dpkg --print-architecture).deb" || code=$?
          [ "$code" = 3 ] || { echo "::error::the root step ran as a user ($code)"; exit 1; }
          if ls /var/tmp | grep cedarlogic-update; then echo "::error::a root copy was left behind"; exit 1; fi
      - name: Start it
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 cedarlogic --screenshot window.png /usr/share/CedarLogic/samples/practice.cdl
          test -s window.png

  install-debian-12:
    name: .deb on Debian 12 (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    container: debian:12
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CedarLogic-Native-linux-deb-${{ matrix.arch }}
          path: debs
      - name: Install the .deb
        run: |
          apt-get update
          apt-get install -y ./debs/*.deb xvfb curl
          cedarlogic --version
          cedarlogic --sync-test
      - name: Start it
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 cedarlogic --screenshot window.png /usr/share/CedarLogic/samples/practice.cdl
          test -s window.png

  # A public download for testers without a GitHub account: one rolling
  # pre-release, replaced on every push to linux/native. Its own job, after
  # both builds, so the release only ever holds a matching pair.
  publish:
    needs: [build, settings, session]
    if: github.ref == 'refs/heads/linux/native'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download both AppImages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: CedarLogic-Native-linux-appimage-*
          path: appimages
          merge-multiple: true

      - name: Download both .debs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: CedarLogic-Native-linux-deb-*
          path: appimages
          merge-multiple: true

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la appimages
          TAG=linux-native-testing
          NOTES=$(cat <<EOT
          Native Linux test build from linux/native (${GITHUB_SHA::7}). Not a release: expect missing pieces.

          This is CedarLogic rebuilt natively for Linux, the way the Mac app was: GTK and Cairo on the same engine as every other CedarLogic, with no OpenGL at all, so it draws the same on a Raspberry Pi as on a PC.

          Easiest (Raspberry Pi OS, Ubuntu, Debian, Mint): paste this into a terminal. It installs CedarLogic with its icon in the applications menu, and it keeps itself up to date:

              curl -fsSL https://github.com/leviholliday/CedarLogic/releases/download/linux-native-testing/install.sh | bash

          Or download the installer for your computer and double-click it (or run sudo apt install ./cedarlogic_arm64.deb):
          - cedarlogic_arm64.deb: Raspberry Pi 4/5 on 64-bit Raspberry Pi OS, ARM laptops
          - cedarlogic_amd64.deb: ordinary PCs and laptops (Intel/AMD)

          Other distros (Fedora, Arch...): the AppImage, one file with nothing to install. Make it executable once (chmod +x, or Properties > Allow executing) and run it; it adds itself to the applications menu. x86_64 for PCs, aarch64 for ARM. If it won't open, install FUSE 2 (Fedora: sudo dnf install fuse; Arch: sudo pacman -S fuse2; Ubuntu 24.04 and newer: sudo apt install libfuse2t64). Without FUSE it has to start with --appimage-extract-and-run on the end every time: run it that way from a terminal, and the applications-menu entry it adds (and .cdl files opened from the file manager) start it that way too.

          Needs Ubuntu 22.04, Debian 12 (Raspberry Pi OS Bookworm), Fedora 36 or newer.
          EOT
          )
          # The very first time, the release (and its tag) start here.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release create "$TAG" --prerelease --title "Native Linux test build" --notes "$NOTES"
          fi
          # CI never signs. The apps install only files a signed SHA256SUMS names, and the key is
          # only on the owner's Mac: after this run, scripts/sign-preview.sh linux checks the
          # release and signs it. Until then the build reaches no one. The last build's manifest
          # goes first, so the release is plainly unsigned while it changes (a stale one couldn't
          # pass anyway: it names the old commit and the old files' hashes).
          for a in SHA256SUMS SHA256SUMS.sig; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$a"; then gh release delete-asset "$TAG" "$a" -y; fi
          done
          # Not install.sh: people pipe it into bash before anything is checked, so
          # only sign-preview.sh uploads it, from the commit it signs.
          gh release upload "$TAG" appimages/*.AppImage appimages/*.deb --clobber
          # Drop anything this run didn't make (older versions), so only the
          # current pair is offered, and the signed install.sh stays.
          keep=$(cd appimages && ls *.AppImage *.deb; echo install.sh)
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            echo "$keep" | grep -qxF "$a" || gh release delete-asset "$TAG" "$a" -y
          done
          # The tag moves last: the apps' update check compares its commit
          # with their own, so they see the new build only once its files
          # are all there.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          gh release edit "$TAG" --prerelease --title "Native Linux test build" --notes "$NOTES"
